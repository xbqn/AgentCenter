<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="description" content="AgentCenter · 本地优先的 Agent 任务中心（H5 独立版）">
<title>AgentCenter · 任务中心</title>
<!-- manifest 与图标只在 http(s) 下引用：file:// 直接打开时浏览器会报 CORS 错误（无功能影响，但会污染控制台） -->
<script>
(function () {
  if (!location.protocol.startsWith('http')) return;
  const add = (rel, href, extra) => {
    const l = document.createElement('link');
    l.rel = rel; l.href = href;
    if (extra) for (const k in extra) l[k] = extra[k];
    document.head.appendChild(l);
  };
  add('manifest', './manifest.webmanifest');
  add('icon', './icon.svg', { type: 'image/svg+xml' });
  add('apple-touch-icon', './icon.svg');
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AgentCenter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F6F8FB; --surface:#FFFFFF; --surface2:#EEF1F6;
  --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.17);
  --tx:#0F172A; --tx2:#475569; --tx3:#8A94A6;
  --blue:#4F46E5; --blue-bg:#EEF0FE; --blue-d:#4338CA;
  --green:#15803D; --green-bg:#E8F7EE;
  --amber:#B45309; --amber-bg:#FDF1E2;
  --red:#DC2626; --red-bg:#FDECEC;
  --purple:#7C3AED; --purple-bg:#F3EEFD;
  --teal:#0E9384; --teal-bg:#E4F6F3;
  --coral:#EA580C; --coral-bg:#FDEFE4;
  --r:12px; --sh:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0E14; --surface:#12161F; --surface2:#1A2130;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.18);
    --tx:#E8ECF3; --tx2:#A3ADC2; --tx3:#6B7690;
    --blue:#8B93FF; --blue-bg:rgba(79,70,229,.26); --blue-d:#A5ACFF;
    --green:#6EE7A0; --green-bg:rgba(21,128,61,.24);
    --amber:#F5B860; --amber-bg:rgba(180,83,9,.24);
    --red:#F87F7F; --red-bg:rgba(220,38,38,.24);
    --purple:#B79BF7; --purple-bg:rgba(124,58,237,.24);
    --teal:#5BD4C4; --teal-bg:rgba(14,147,132,.24);
    --coral:#F9A870; --coral-bg:rgba(234,88,12,.24);
    --sh:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;font-size:14px;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
/* ---------- shell：顶部横向导航 + 满宽内容区 ----------
   默认不再用左侧竖栏：导航铺在顶部一行，主区域吃掉整个宽度。
   窄屏只是把这一行允许横向滚动、隐藏分组标题，结构不变。 */
.shell{display:flex;flex-direction:column;min-height:100vh}
.side{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;min-width:0;
  background:var(--surface);border-bottom:1px solid var(--line);padding:8px 18px;
}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:0}
.brand b{display:block;font-size:13px;font-weight:600;letter-spacing:-.2px;line-height:1.3;white-space:nowrap}
.brand span{display:none}
.logo{width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 26px}
.navwrap{display:flex;align-items:center;gap:4px;flex:1 1 auto;min-width:0;position:relative}
.nav{display:flex;flex-direction:row;align-items:center;gap:2px;flex:1 1 auto;min-width:0;margin:0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
/* 菜单超出可视区域时的左右滚动箭头：只在真能滚的那一侧出现 */
.navmore{flex:0 0 auto;width:24px;height:26px;padding:0;border-radius:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--tx2);cursor:pointer;display:none;align-items:center;justify-content:center}
.navmore[data-show="1"]{display:inline-flex}
.navmore:hover{background:var(--surface2);color:var(--tx)}
.navmore:disabled{opacity:.35;cursor:default;background:var(--surface);color:var(--tx3)}
.navmore svg{width:14px;height:14px}
.nav-g{display:none}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:7px;font-size:12.6px;color:var(--tx2);line-height:1.4;white-space:nowrap;flex:0 0 auto}
.nav a svg{width:15px;height:15px;flex:0 0 15px;opacity:.7}
.nav a:hover{background:var(--surface2);color:var(--tx)}
.nav a.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
.nav a.on svg{opacity:1}
.nav a em{margin-left:2px;font-style:normal;font-size:10.5px;color:var(--tx3);background:var(--surface2);border-radius:8px;padding:0 6px;line-height:16px}
.nav a.on em{background:var(--surface);color:var(--blue)}
.side-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin:0;padding:0 0 0 10px;border:0;border-left:1px solid var(--line)}
.side-foot .btn.block{display:inline-flex;width:auto;height:30px;padding:0 12px;flex:0 0 auto}
.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--tx3);padding:0;line-height:1.4;
  max-width:32vw;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 嵌入 DSH 面板时：连接状态与「立即扫描」由面板工具栏承担，页内不再重复 */
body[data-embedded="1"] .side-foot{display:none}
body[data-embedded="1"] #tbStamp{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:15px 30px 14px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.topbar p{font-size:11.5px;color:var(--tx3);margin-top:1px}
.tb-r{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.wrap{width:100%;max-width:1180px;padding:20px 30px 56px}
.live{width:7px;height:7px;border-radius:50%;background:var(--tx3);opacity:.5;flex:0 0 7px}
.live.on{background:var(--green);opacity:1;box-shadow:0 0 0 3px rgba(21,128,61,.16)}
.iconbtn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:.5px solid var(--line);background:var(--surface);color:var(--tx2)}
.iconbtn:active{background:var(--surface2)}
.iconbtn svg{width:17px;height:17px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- pull to refresh ---------- */
.ptr{
  position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;z-index:40;
  transform:translate(-50%,-48px);opacity:0;transition:transform .18s ease,opacity .18s ease;
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx2);
  background:var(--surface);border:.5px solid var(--line);border-radius:20px;padding:5px 12px;box-shadow:var(--sh);
}
.ptr i{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--line2);border-top-color:var(--blue);display:block}
.ptr.busy i{animation:spin .7s linear infinite}
/* ---------- layout ---------- */
.sec{margin:0 0 16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:13px;font-weight:600;letter-spacing:-.1px;color:var(--tx)}
.sec-h span{font-size:11px;color:var(--tx3)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;box-shadow:var(--sh)}
.card + .card{margin-top:10px}
.muted{color:var(--tx3);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px}
/* ---------- hero ---------- */
.hero{
  margin:0 0 16px;border-radius:10px;padding:18px 20px 16px;color:#fff;
  background:linear-gradient(120deg,#4338CA 0%,#4F46E5 48%,#7C3AED 100%);
  box-shadow:0 2px 10px rgba(79,70,229,.22);
}
.hero .hd{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;opacity:.86}
.hero .one{font-size:15px;font-weight:600;line-height:1.5;margin:9px 0 2px;letter-spacing:-.2px}
.hero .sub{font-size:11.5px;opacity:.86}
.hero .row{display:flex;gap:8px;margin-top:12px;padding-top:11px;border-top:.5px solid rgba(255,255,255,.24)}
.hero .row>div{flex:1;text-align:left}
.hero .row b{display:block;font-size:17px;font-weight:600;letter-spacing:-.3px}
.hero .row span{font-size:10.5px;opacity:.8}
/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--sh)}
.kpi .l{font-size:11.5px;color:var(--tx2);display:flex;align-items:center;gap:5px}
.kpi .v{font-size:23px;font-weight:600;letter-spacing:-.7px;margin-top:3px;line-height:1.2}
.kpi .s{font-size:10.5px;color:var(--tx3);margin-top:2px}
.kpi.acc .v{color:var(--blue)} .kpi.warn .v{color:var(--amber)} .kpi.bad .v{color:var(--red)}
/* 可点击的 KPI 卡片：整卡是链接，hover 时边框与箭头提示「可进入清单」 */
.kpi.klink{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
.kpi.klink:hover{border-color:color-mix(in srgb,var(--blue) 40%,transparent);box-shadow:0 2px 8px rgba(79,70,229,.12);transform:translateY(-1px)}
.kpi.klink .l{justify-content:space-between}
.kpi.klink .ka{width:12px;height:12px;flex:0 0 12px;color:var(--tx3);transition:color .15s,transform .15s}
.kpi.klink:hover .ka{color:var(--blue);transform:translateX(2px)}
/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:500}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.done{background:var(--green-bg);color:var(--green)}
.pill.run{background:var(--blue-bg);color:var(--blue)}
.pill.int{background:var(--red-bg);color:var(--red)}
.pill.wait{background:var(--amber-bg);color:var(--amber)}
.chip{display:inline-flex;align-items:center;font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--tx2)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.green{background:var(--green-bg);color:var(--green)}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.purple{background:var(--purple-bg);color:var(--purple)}
.chip.teal{background:var(--teal-bg);color:var(--teal)}
.chip.coral{background:var(--coral-bg);color:var(--coral)}
/* ---------- filters（桌面端：换行不横滑，方角分段） ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.filters button{flex:0 0 auto;font-size:12px;color:var(--tx2);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:7px;line-height:1.5}
.filters button:hover{border-color:var(--line2);color:var(--tx)}
.filters button.on{background:var(--blue-bg);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent);font-weight:600}
/* ---------- 日期工具条（起止日期筛选 + 排序切换） ---------- */
.dbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.dbar .dlab,.dbar .dsep{font-size:11.5px;color:var(--tx3);flex:0 0 auto}
/* 原生 input[type=date] 空值时会显示浏览器的 yyyy/mm/dd 占位符，中文界面下很突兀。
   这里用一层覆盖文字替代占位符：保留原生日期选择器的交互与可访问性，只在空值时显示中文提示。 */
.dbar .dwrap{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}
.dbar .dwrap .ph{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--tx3);pointer-events:none;white-space:nowrap;
}
.dbar input[type=date]{
  font-family:inherit;font-size:12px;color:var(--tx);background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:5px 8px;line-height:1.5;
  width:126px;min-width:0;
}
.dbar input[type=date]:focus{outline:none;border-color:var(--blue)}
/* 有值时隐藏覆盖文字；空值（:invalid 或 data-empty）时显示 */
.dbar .dwrap:not(.has-val) input[type=date]{color:transparent}
.dbar .dwrap.has-val .ph{display:none}
.dbar .btn{padding:6px 11px;font-size:12px}
.dbar .dq{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dbar .dnote{font-size:11px;color:var(--tx3);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- 人工标记完成 ---------- */
/* 基础样式与 .trow 无关，列表行与详情页共用；尺寸在各自容器里微调 */
.mark{display:inline-flex;align-items:center;gap:3px;font-size:11px;line-height:1.5;
  padding:2px 8px;border-radius:6px;border:1px solid color-mix(in srgb,var(--green) 42%,transparent);
  background:var(--green-bg);color:var(--green);white-space:nowrap;cursor:pointer;
  font-family:inherit;font-weight:500}
.mark svg{width:11px;height:11px;flex:0 0 11px}
.mark:hover{background:var(--green);color:#fff;border-color:var(--green)}
.mdone{font-size:10px;line-height:1.5;padding:1px 6px;border-radius:5px;
  background:var(--surface2);color:var(--tx3);white-space:nowrap}
/* 列表行里更紧凑：状态徽章下面一行小按钮 */
.trow .st{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.trow .mark{font-size:9.5px;padding:1px 6px;border-radius:5px;gap:3px}
.trow .mark svg{width:9px;height:9px;flex:0 0 9px}
.trow .mdone{font-size:9px;padding:1px 5px}
/* ---------- 对话回放 ---------- */
.conv-box{min-width:0}
.conv-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--tx3);margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.conv-src{font-size:10.5px;color:var(--tx3);margin-top:7px;word-break:normal;overflow-wrap:anywhere}
.conv{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.cev{border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.62;border-left:3px solid transparent;background:var(--surface2);min-width:0}
.cev.u{background:var(--blue-bg);border-left-color:var(--blue)}
.cev.a{background:var(--surface2);border-left-color:var(--blue-d)}
.cev.k{background:transparent;border-left-color:var(--line2);color:var(--tx3)}
.cev.t{background:var(--purple-bg);border-left-color:var(--purple)}
.cev.r{background:var(--surface2);border-left-color:var(--teal);color:var(--tx2)}
.cev.d{background:var(--amber-bg);border-left-color:var(--amber)}
.ceh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11px;color:var(--tx3);margin-bottom:3px}
.ceh b{font-size:11.5px;color:var(--tx);font-weight:600}
.cev.k .ceh b{color:var(--tx3)}
.ceb{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:var(--tx)}
.cev.k .ceb,.cev.r .ceb{color:var(--tx2)}
.cex{margin-top:5px;font-size:11px;color:var(--blue);background:none;padding:0}
.cex:hover{text-decoration:underline}
.dsr{border-bottom:1px solid var(--line);padding:10px 2px}
.dsr:last-child{border-bottom:0}
.dsr-h{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--tx);font-size:12.5px;flex-wrap:wrap}
.dsr-h b{font-weight:600}
.dsr-hit{display:flex;gap:8px;align-items:baseline;margin-top:5px;font-size:11.5px;color:var(--tx2);line-height:1.55}
.dsr-role{flex:0 0 auto;font-size:10px;padding:0 6px;border-radius:5px;background:var(--surface2);color:var(--tx3)}
.dsr-role.think{background:var(--purple-bg);color:var(--purple)}
.dsr-role.user{background:var(--blue-bg);color:var(--blue)}
.dsr-role.assistant{background:var(--surface2);color:var(--tx2)}
.dsr-time{flex:0 0 auto;color:var(--tx3);font-variant-numeric:tabular-nums}
.dsr-text{min-width:0;word-break:break-word;overflow-wrap:anywhere}
/* 对话正文按 Markdown 渲染：复用 .md-view 的排版，只去掉预格式化并按高度折叠 */
.ceb.md-body{white-space:normal}
.ceb.md-body[data-fold="1"]{max-height:300px;overflow:hidden}
.ceb.md-body>*:first-child{margin-top:0}
.ceb.md-body>*:last-child{margin-bottom:0}
.ceb.md-body p{margin:5px 0}
.ceb.md-body ul.md-l,.ceb.md-body ol.md-l{margin:5px 0;padding-left:20px}
.ceb.md-body a{color:var(--blue);text-decoration:none}
.ceb.md-body a:hover{text-decoration:underline}
.ceb.md-body hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.conv-meta .grow{flex:1 1 auto}
.conv-act{font-size:11px;padding:3px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);color:var(--tx2);cursor:pointer;white-space:nowrap;font-family:inherit}
.conv-act:hover{border-color:var(--blue);color:var(--blue)}
.link-note{font-size:11.5px;line-height:1.6;color:var(--tx3)}
.mono.session-id{font-size:11px;color:var(--tx2);word-break:break-all;overflow-wrap:anywhere}
/* ---------- 日报列表与原文 ---------- */
.rlist .rrow{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.rlist .rrow:last-child{border-bottom:0}
.rlist .rrow:hover{background:var(--surface2)}
.rrow .rmain{flex:1;min-width:0}
.rrow .rmain b{display:block;font-size:12.5px;font-weight:600;color:var(--tx);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.rrow .rmain small{display:block;font-size:11px;color:var(--tx3);line-height:1.55;margin-top:3px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rrow .rmeta{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3)}
/* Markdown 预览 */
.md-view{font-size:12.5px;line-height:1.75;color:var(--tx);min-width:0}
.md-view h3,.md-view h4,.md-view h5{margin:14px 0 6px;font-weight:600;letter-spacing:-.2px}
.md-view h3{font-size:15px} .md-view h4{font-size:13.5px} .md-view h5{font-size:12.5px}
.md-view h3:first-child,.md-view h4:first-child{margin-top:0}
.md-view p{margin:5px 0}
.md-view .md-q{background:var(--blue-bg);color:var(--blue-d);padding:8px 11px;border-radius:8px;margin:6px 0;font-size:12px}
.md-view ul.md-l{margin:6px 0;padding-left:18px}
.md-view ul.md-l li{margin:2px 0}
.md-view code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;
  background:var(--surface2);padding:1px 4px;border-radius:4px}
.md-view table.md-t{width:100%;border-collapse:collapse;margin:8px 0;font-size:11.5px;display:block;overflow-x:auto}
.md-view table.md-t th,.md-view table.md-t td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.md-view table.md-t th{background:var(--surface2);font-weight:600}
.md-view pre.md-code{margin:7px 0;padding:9px 11px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--line);overflow-x:auto}
.md-view pre.md-code code{background:none;padding:0;font-size:11px;line-height:1.6;white-space:pre}
.md-view hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.md-view ol.md-l{margin:6px 0;padding-left:20px}
.md-view a{color:var(--blue);text-decoration:none}
.md-view a:hover{text-decoration:underline}
/* ---------- 概览「进行中任务」紧凑行 ---------- */
.tbl.compact .crow{display:block;padding:10px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.tbl.compact .crow:last-child{border-bottom:0}
.tbl.compact .crow:hover{background:var(--surface2)}
.crow .cmain{min-width:0}
.crow .cmain b{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cmain small{display:block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.crow .cmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--tx3)}
.crow .cmeta .pill{font-size:10px;padding:1px 7px}
.crow .cmeta .chip{font-size:10px;padding:1px 7px}
/* ---------- 任务分组 ---------- */
.grp-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.grp-tools .glab{font-size:11.5px;color:var(--tx3);flex:0 0 auto}
/* 分组层级按钮复用 .filters 的按钮样式 */
.grp-tools button{flex:0 0 auto;font-size:12px;color:var(--tx2);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:7px;line-height:1.5}
.grp-tools button:hover{border-color:var(--line2);color:var(--tx)}
/* 已选维度的层级序号 */
.grp-tools button .ord{display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:9.5px;font-style:normal;font-weight:600;margin-right:4px;vertical-align:middle}
.gchain{font-size:11.5px;color:var(--tx2);display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.gchain em{font-style:normal;color:var(--tx3)}
.gnone{font-size:11.5px;color:var(--tx3)}
/* 嵌套层级：每深一层加左缩进 + 顶部细线，视觉上形成树 */
.grp.lv1{margin-left:14px}
.grp.lv2{margin-left:28px}
.grp.lv3{margin-left:42px}
.grp.lv1 .grp-h,.grp.lv2 .grp-h,.grp.lv3 .grp-h{background:transparent;border-top:1px solid var(--line)}
.grp.lv1,.grp.lv2,.grp.lv3{border:0;box-shadow:none;border-radius:0;background:transparent}
.grp.lv1>.grp-b,.grp.lv2>.grp-b,.grp.lv3>.grp-b{border-left:1px solid var(--line);margin-left:6px}
.grp-h .glv{flex:0 0 auto;font-size:9.5px;color:var(--tx3);background:var(--surface);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;line-height:1.5;white-space:nowrap}
.grp.open>.grp-h .glv{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.grp{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--sh)}
.grp-h{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--surface2);cursor:pointer;user-select:none;min-width:0}
.grp-h:hover{background:var(--blue-bg)}
.grp-h .cr{flex:0 0 auto;width:12px;height:12px;transition:transform .15s;color:var(--tx3)}
.grp.open .grp-h .cr{transform:rotate(90deg)}
.grp-h .gt{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.grp-h .gm{flex:0 0 auto;font-size:11px;color:var(--tx3);display:flex;gap:8px;align-items:center}
.grp-b{display:none}
.grp.open .grp-b{display:block}
.grp-b .tbl{border:0;box-shadow:none;border-radius:0}
/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 11px;width:320px;max-width:100%}
.search input{flex:1;border:0;background:none;font-size:12.5px;color:var(--tx);outline:none;font-family:inherit}
.search svg{width:14px;height:14px;color:var(--tx3);flex:0 0 14px}
/* ---------- 任务表（桌面端） ---------- */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.tbl-h,.trow{display:grid;grid-template-columns:var(--tc,82px minmax(0,1fr) 104px 70px 74px 112px 112px);gap:12px;align-items:center;padding:9px 16px}
.tbl-h{font-size:10px;color:var(--tx3);letter-spacing:.05em;background:var(--surface2);border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl-h .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-h .dim{font-variant-numeric:tabular-nums}
.trow{border-bottom:1px solid var(--line);font-size:12.5px;color:var(--tx);transition:background .12s}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface2)}
.trow .tt{min-width:0}
.trow .tt b{display:block;font-size:12.8px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tt small{display:block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.trow .n{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--tx2)}
.trow .dim{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .st .pill{font-size:10px;padding:1px 7px}
.trow .ag .chip{font-size:10px;padding:1px 7px}
/* 时间单元：年月日在上、时间在下（两行），列宽再怎么拖也不会挤成一行 */
.trow .dstart,.trow .dend{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.trow .ds1{font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .ds2{font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* 列宽可拖动：表头每格右边缘的抓手 */
.tbl-h .hcell{position:relative;min-width:0}
.tbl-h .hcell .rz{position:absolute;top:-9px;right:-9px;width:12px;height:34px;cursor:col-resize;z-index:3;display:block}
.tbl-h .hcell .rz:after{content:"";position:absolute;top:9px;bottom:9px;left:5px;width:1px;background:var(--line)}
.tbl-h .hcell .rz:hover:after,.tbl-h .hcell .rz:active:after{background:var(--blue);width:2px}
/* 下拉：状态 / 排序 / 分组，统一成同一套外观 */
.sel{appearance:none;-webkit-appearance:none;height:30px;padding:0 26px 0 10px;border-radius:8px;
  border:1px solid var(--line);background-color:var(--surface);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238c8c93' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:12px 12px;
  color:var(--tx);font-size:12px;line-height:28px;cursor:pointer;max-width:210px;flex:0 0 auto}
.sel:hover{border-color:var(--line2)}
.sel:focus{outline:2px solid var(--blue-bg);outline-offset:1px}
.kv dd.pth{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;color:var(--tx2);line-height:1.5;word-break:normal;overflow-wrap:anywhere}
/* ---------- bars ---------- */
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:5px}
.brow .v{color:var(--tx2);font-size:11px;flex:0 0 auto}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.bwrap + .bwrap{margin-top:11px}
/* ---------- list rows ---------- */
.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.row:first-child{padding-top:0}
.row .ic{width:32px;height:32px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:0 0 32px;color:var(--tx2)}
.row .ic svg{width:16px;height:16px}
.row .b{flex:1;min-width:0}
.row .b .t{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.row .b .d{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:0 0 auto;font-size:12px;color:var(--tx2);text-align:right}
/* ---------- todo ---------- */
.todo{display:flex;gap:11px;padding:11px 0;border-bottom:.5px solid var(--line);align-items:flex-start}
.todo:last-child{border-bottom:0;padding-bottom:0}
.todo:first-child{padding-top:0}
.cbx{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);flex:0 0 19px;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.cbx.on{background:var(--green);border-color:var(--green)}
.cbx svg{width:12px;height:12px;color:#fff;opacity:0}
.cbx.on svg{opacity:1}
.todo .b{flex:1;min-width:0}
.todo .t{font-size:13px;line-height:1.5}
.todo.done .t{text-decoration:line-through;color:var(--tx3)}
.todo .m{font-size:11px;color:var(--tx3);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--blue);margin:0 0 10px;padding:2px 0}
/* 二级页已成为侧栏一级入口，不再需要「返回」 */
div.back{display:none}
.back svg{width:14px;height:14px}
.dhead{margin:0 0 16px}
.dhead h2{font-size:18px;font-weight:600;line-height:1.42;letter-spacing:-.3px}
.dhead .dm{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:74px 1fr;gap:9px 12px;font-size:12.5px}
.kv dt{color:var(--tx3);font-size:12px}
.kv dd{color:var(--tx);word-break:break-word}
.tl{position:relative;padding-left:19px;margin-top:4px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:4px;width:1px;background:var(--line)}
.ev{position:relative;padding-bottom:14px}
.ev:last-child{padding-bottom:0}
.ev:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line2)}
.ev.u:before{border-color:var(--blue)} .ev.a:before{border-color:var(--teal)} .ev.t:before{border-color:var(--amber)}
.ev .eh{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--tx3)}
.ev .eh b{font-size:12px;color:var(--tx);font-weight:600}
.ev .eb{font-size:12.5px;color:var(--tx2);margin-top:3px}
.tool{background:var(--surface2);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:11px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--tx2);overflow-x:auto;white-space:pre;line-height:1.7}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:12px}
.frow:last-child{border-bottom:0;padding-bottom:0}
.frow:first-child{padding-top:0}
.frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
.frow .fs{flex:0 0 auto;color:var(--tx3);font-size:11px}
/* ---------- callout ---------- */
.callout{display:flex;gap:10px;padding:12px 13px;border-radius:var(--r);font-size:12px;line-height:1.55}
.callout.red{background:var(--red-bg);color:var(--red)}
.callout.amber{background:var(--amber-bg);color:var(--amber)}
.callout.blue{background:var(--blue-bg);color:var(--blue)}
.callout b{font-weight:600}
/* ---------- empty ---------- */
.empty{text-align:center;padding:36px 20px;color:var(--tx3);font-size:12.5px}
.empty b{display:block;font-size:13px;color:var(--tx2);margin-bottom:3px}
/* ---------- trend / layers / cmd ---------- */
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* 趋势柱：14 根柱若各占 flex:1，在宽屏会被拉成一根根宽条而「贴在一起」。
   改为限宽窄柱 + 等距分布，柱与柱之间始终留出可分辨的间隔。
   标签行按同一网格排布（首尾靠边、中间均分），避免「10-17」压在首柱上。 */
.trend{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));align-items:flex-end;
  justify-items:center;column-gap:4px;height:76px;margin-top:6px}
.trend i{width:100%;max-width:18px;min-width:4px;background:var(--blue);border-radius:3px 3px 0 0;opacity:.55;min-height:3px}
.trend i.hi{opacity:1}
.trend i.tod{background:var(--blue-d);opacity:1}
.trend-l{display:flex;justify-content:space-between;align-items:baseline;
  font-size:9.5px;color:var(--tx3);margin-top:5px}
.cmd{background:var(--surface2);border-radius:9px;padding:10px 11px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10.5px;line-height:1.8;color:var(--tx2);overflow-x:auto;white-space:pre}
.layer{border:.5px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
.layer .lh{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.layer .lh b{font-size:12px}
.layer .lh span{font-size:10.5px;color:var(--tx3)}
.layer .li{display:flex;gap:6px;flex-wrap:wrap}
.down{text-align:center;color:var(--tx3);font-size:10.5px;padding:5px 0}
/* ---------- config center ---------- */
.cfg{padding:11px 0;border-bottom:.5px solid var(--line)}
.cfg:last-child{border-bottom:0;padding-bottom:0}
.cfg:first-child{padding-top:0}
.cfg-h{display:flex;align-items:center;gap:8px}
.cfg-h .n{font-size:13px;font-weight:500}
.cfg-h .sw{margin-left:auto}
.cfg-p{margin-top:6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;color:var(--tx2);
  background:var(--surface2);border-radius:7px;padding:6px 9px;word-break:normal;overflow-wrap:anywhere;cursor:pointer}
.cfg-m{font-size:10.5px;color:var(--tx3);margin-top:6px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.fld{margin-top:10px}
.fld label{font-size:11px;color:var(--tx3);display:block;margin-bottom:4px}
.fld input,.fld select{width:100%;border:.5px solid var(--line2);background:var(--surface2);border-radius:9px;
  padding:8px 10px;font-size:12px;color:var(--tx);font-family:inherit;outline:none;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
/* 桌面端：监控对象两列、表单两列 */
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
/* ---------- 响应式：顶部导航本来就是一行，窄屏只收紧间距与字号 ---------- */
@media (max-width:1000px){
  /* 顶栏一行放不下时：品牌与状态下沉到第二行，导航独占第一行（仍然不回到左侧竖栏）。 */
  .side{display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"brand foot" "nav nav";
    align-items:center;gap:6px 10px;padding:8px 12px}
  .brand{grid-area:brand}
  .navwrap{grid-area:nav}
  .side-foot{grid-area:foot;justify-content:flex-end;border-left:0;padding-left:0;min-width:0}
  .side-foot .btn.block{display:inline-flex}
  .nav a em{display:none}
  .topbar{padding:13px 18px 12px}
  .wrap{padding:16px 18px 40px}
  .cols2{grid-template-columns:1fr}
}
@media (max-width:900px){
  /* FR-UI-09：820px 视口下侧栏已转为顶部横条，需要保证横条可横向滚动但不撑破页面 */
  .side{overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .topbar{padding:12px 16px 11px}
  .wrap{padding:14px 16px 36px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl-h{display:none}
  /* 卡片模式：状态 | 标题+目录 | 开始 | 结束。
     两个日期列保留（日期是任务的关键信息），只隐藏活跃/空间/Agent。 */
  .trow{grid-template-columns:62px minmax(0,1fr) auto auto;gap:8px;padding:10px 13px;align-items:start}
  .trow .n,.trow .ag{display:none}
  .trow .dim{display:block;font-size:10.5px;text-align:right;line-height:1.5;white-space:nowrap}
  /* 卡片模式仍保持「年月日在上、时间在下」两行 */
  .trow .dstart,.trow .dend{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
  .search{width:100%}
  .cfg-grid,.form-grid{grid-template-columns:1fr}
}
@media (max-width:420px){
  /* 390px：完整年月日横向放不下，日期区改为右侧竖排两行；
     状态列留够「标记完成」按钮的宽度，避免按钮压到标题上。 */
  .trow{grid-template-columns:74px minmax(0,1fr) auto;gap:6px 8px;padding:9px 11px;align-items:start}
  .trow .dstart{grid-column:3;grid-row:1;text-align:right;font-size:10px;line-height:1.5}
  .trow .dend{grid-column:3;grid-row:2;text-align:right;font-size:10px;line-height:1.5}
  .trow .tt{grid-column:2;grid-row:1 / span 2}
  .trow .tt small{font-size:9.5px}
  .trow .tt b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .trow .mark{font-size:9px;padding:1px 5px}
  .side{padding:7px 10px}
  .brand{padding:0 6px 0 0}
  .nav a{padding:6px 8px;font-size:12px}
  .topbar{padding:11px 12px 10px}
  .wrap{padding:12px 12px 32px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:11px 12px}
  .kpi .v{font-size:20px}
  .hero{padding:14px 15px}
  .hero .row b{font-size:15px}
  .filters button{padding:5px 9px;font-size:11.5px}
  .card{padding:13px}
  .kv{grid-template-columns:62px minmax(0,1fr)}
}
/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);
  background:rgba(28,28,26,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:78vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- misc ---------- */
.note{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:9px}
.divider{height:.5px;background:var(--line);margin:13px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:13px;border:.5px solid var(--line2);background:var(--surface);color:var(--tx)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.block{display:flex;width:100%}
.btn:active{opacity:.85}
.btn:disabled{opacity:.45;cursor:default}

</style>
</head>
<body>
<div class="shell">
  <aside class="side">

      <button class="navmore" id="navR" type="button" aria-label="菜单向右" title="菜单向右" data-show="0"

<div class="toast" id="toast"></div>

<script>
/* ============ 数据（演示数据；接入守护进程后由 /api/summary 覆盖） ============ */
const AGENTS = [];   // 真实数据由 /api/summary 填充；离线兜底见 ensureOfflineFallback()

const TASKS = [];   // 真实数据由 /api/summary 填充

/* 任务的物理路径：dir = 任务工作目录，src = 该任务会话记录的源文件（各 Agent 默认存储位置） */
/* Windows 路径按段拼接，避免源码里的反斜杠转义出错 */
const WIN = (...seg) => seg.join('\\');
/* 各 Agent 的默认对话记录路径（与《Agent 适配器规格》一致）。
   注意：这些只是「离线时用于展示」的路径约定，真实路径一律由服务端 /api/summary 下发，
   不再写死某台机器的用户名。 */
const AGPATH = {
  workbuddy:  '~/.workbuddy/projects',
  codebuddy:  '%APPDATA%/CodeBuddy CN/codebuddy-sessions.vscdb',
  atomcode:   '~/.atomcode/sessions',
  opencode:   '~/.local/share/opencode/opencode.db',
  deepseek:   '~/.dsh/sessions',
  qwen:       '%APPDATA%/Tongyi',
  trae:       '%APPDATA%/Trae/User/globalStorage',
  qoder:      '~/.qoder-cn/projects',
  zcode:      '~/.zcode/sessions',
  codex:      '~/.codex/sessions',
  claudecode: '~/.claude/projects',
  doubao:     '%APPDATA%/Bytedance/Doubao'
};
const AGKIND = {
  workbuddy:'JSONL', codebuddy:'SQLite', atomcode:'JSONL', opencode:'SQLite',
  deepseek:'zstd JSONL', qwen:'Electron 存储', trae:'SQLite',
  zcode:'JSONL', codex:'JSONL', claudecode:'JSONL', qoder:'JSONL', doubao:'Electron 存储'
};
AGENTS.forEach((a) => { a.path = AGPATH[a.id] || ''; a.kind = AGKIND[a.id] || 'JSONL'; a.on = a.inst; });



/* 演示数据补日期字段（真实数据由 applySummary 填充）：跨 3 天，便于验证日期筛选与排序 */



const TODOS = [];   // 真实数据由 /api/summary 填充

const FILES = [];   // 真实数据由 /api/summary 填充

/* 近 14 天：完成任务数与活跃时长（分钟），用于趋势图与「近 7 天 / 近 14 天」汇总 */
const TREND = [];   // 真实数据由 /api/summary 填充

/* 任务详情的时间线 / 文件（演示） */


/* ============ 真实数据接入（/api/summary → 演示数据形态） ============ */
/* 服务端契约字段（见《展示形态与H5方案》§6.2）与页面内部结构不同：
   这里做一次映射，页面渲染函数无需感知数据来源。 */
const ST_MAP = { completed: 'done', running: 'run', interrupted: 'int', waiting: 'wait', failed: 'int', pending: 'wait' };

function applySummary(data) {
  if (!data || !Array.isArray(data.tasks)) return false;
  // Agent 列表：完全以服务端为准重建（含用户新增的自定义适配器，不能只匹配内置名单）。
  // 配色按 id 稳定分配，避免刷新后颜色漂移。
  const TONES = ['blue', 'teal', 'purple', 'green', 'coral', 'amber'];
  const prevById = {};
  AGENTS.forEach((a) => { prevById[a.id] = a; });
  const realAgents = (data.agents || []).map((r, i) => ({
    id: r.id,
    name: r.name || r.id,
    inst: !!r.installed,
    sess: r.sessions || 0,
    size: (r.bytes || 0),
    path: r.path || '',
    kind: r.kind || 'JSONL',
    tasks: r.tasks || 0,
    custom: !!r.custom,
    disabled: !!r.disabled,
    // 配色：优先沿用上一轮，其次按位置分配
    tone: (prevById[r.id] && prevById[r.id].tone) || TONES[i % TONES.length],
    on: prevById[r.id] ? prevById[r.id].on : !!r.installed
  }));
  AGENTS.length = 0;
  AGENTS.push(...realAgents);

  // 任务
  const list = data.tasks.map((t, i) => ({
    id: String(t.id || 't' + i),
    a: t.agent || '未知',
    title: t.title || '未命名任务',
    proj: t.project || '—',
    s: t.start || '—',
    e: t.end || null,
    // 年月日：来自服务端的 ISO 起止时间；用于展示、排序与日期筛选
    sd: (t.startedAt || '').slice(0, 10),
    ed: (t.endedAt || '').slice(0, 10) || (t.startedAt || '').slice(0, 10),
    ts: Date.parse(t.startedAt) || 0,
    te: Date.parse(t.endedAt) || Date.parse(t.startedAt) || 0,
    wall: t.wallMinutes || 0,
    act: t.activeMinutes || 0,
    st: ST_MAP[t.status] || 'wait',
    msg: t.messages || 0,
    tc: t.toolCalls || 0,
    sp: (t.bytes || 0),
    files: t.files || 0,
    todo: t.todos || 0,
    reason: t.statusReason || '',
    dir: t.dir || '',
    src: t.src || '',
    preview: t.lastMessagePreview || '',
    // 会话标识：同一会话可切分出多个任务（按 >30min 用户消息间隔），用于「按会话」分组
    sid: t.sessionId || '',
    fv: (t.formatVersion === undefined ? null : t.formatVersion),
    // 人工覆盖：用户已把「已中断 / 等待确认」标记为完成，保留原始判定以便回溯
    manual: !!t.manualDone,
    manualAt: t.manualDoneAt || null,
    autoSt: t.autoStatus ? (ST_MAP[t.autoStatus] || null) : null
  }));
  TASKS.length = 0;
  TASKS.push(...list);

  // 待办
  const todos = Array.isArray(data.todos) ? data.todos : [];
  TODOS.length = 0;
  TODOS.push(...todos.map((t) => ({ t: t.text, a: t.agent, p: t.project, done: !!t.done, id: t.id })));
  // 本地勾选按 id 持久化：服务端待办增减后仍能恢复用户的勾选状态，
  // 不再因为数组长度变化就整体丢弃 localStorage（那会让勾选看起来「点了没反应」）
  const savedTodoMap = readTodoMap();
  state.todos = TODOS.map((x, i) => {
    const local = savedTodoMap[x.id || ('idx' + i)];
    return local === undefined ? !!x.done : !!local;
  });

  // 中间文件
  const inter = Array.isArray(data.intermediates) ? data.intermediates : [];
  FILES.length = 0;
  FILES.push(...inter.map((f) => ({
    p: f.path, n: f.label || f.path, a: f.agent || '—',
    sz: (f.bytes || 0), kind: f.reclaimable === false ? '保留' : '回收'
  })));

  // 趋势
  if (Array.isArray(data.trend) && data.trend.length) {
    TREND.length = 0;
    TREND.push(...data.trend.map((d) => ({ d: d.d, n: d.n || 0, act: d.act || 0 })));
  }

  state.generatedAt = data.generatedAt || '';
  state.newBytes = (data.summary && data.summary.newBytes) || 0;
  state.live = true;
  return true;
}

/* 读取 /api/summary；失败静默降级到演示数据（FR-UI-10，不弹错误框、不阻塞） */
async function loadSummary() {
  if (!location.protocol.startsWith('http')) return false;
  try {
    const r = await fetch('api/summary?range=' + encodeURIComponent(state.range), { cache: 'no-store' });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !j.ok || !j.data) return false;
    return applySummary(j.data);
  } catch (e) { return false; }
}


const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
/* 路径在换行时按分隔符断开，避免从词中间劈开 */
const brkPath = (p) => esc(p || '—').split('\\').join('\\' + String.fromCharCode(8203));
/* 体积格式化：入参为字节。小于 1 KB 也要显示，避免小库一律显示 0.00 MB 让人以为统计失效 */
const fmtB = (bytes) => {
  const b = Number(bytes) || 0;
  if (b >= 1024 * 1024 * 1024) return (b / 1073741824).toFixed(1) + ' GB';
  if (b >= 1024 * 1024) return (b / 1048576).toFixed(b < 10 * 1048576 ? 2 : 0) + ' MB';
  if (b >= 1024) return Math.round(b / 1024) + ' KB';
  return b > 0 ? b + ' B' : '0';
};
const fmt = fmtB;
const hm = (min) => min >= 60 ? Math.floor(min / 60) + 'h' + (min % 60 ? (min % 60) + 'm' : '') : min + 'm';
const STL = { done:'已完成', run:'进行中', int:'已中断', wait:'等待确认' };
const tone = (a) => (AGENTS.find((x) => x.name === a) || {}).tone || 'blue';
const badge = (a) => '<span class="chip ' + tone(a) + '">' + esc(a) + '</span>';
const pill = (st) => '<span class="pill ' + st + '"><i></i>' + STL[st] + '</span>';

const state = {
  range: 'today',
  filter: 'all',
  aFilter: 'all',
  q: '',
  // 搜索范围：title=标题/项目/Agent（默认，纯前端）；content=会话正文；think=含模型思考
  qScope: 'title',
  deep: null,          // { loading, error, ms, count, items }
  // 任务清单的日期维度：按哪个时间排序（end=截止/结束，start=开始）+ 方向 + 起止日期筛选
  sortKey: 'end',
  sort: 'desc',
  // 任务表列宽（第 2 列为弹性列，其余为像素）；启动时由 loadCols() 用 localStorage 覆盖
  colW: [82, 0, 104, 70, 74, 112, 112],
  dateFrom: '',
  dateTo: '',
  // 分组层级数组：[] = 不分组；[agent, proj, session] = 三级嵌套
  groupLevels: [],
  groupOpen: {},
  lastScan: '—',
  servicePort: 7788,
  // 环境能力：Node 缺 zstd 时 nodeNotice 会是一句可读的原因（显示在「设置与关于」）
  zstd: true,
  nodeNotice: '',
  online: false,
  live: false,
  editing: -1,
  prev: '#/home',
  todos: TODOS.map((x) => !!x.done),
  seen: false
};

/* ============ 汇总计算 ============ */
function summary() {
  const t = TASKS;
  const done = t.filter((x) => x.st === 'done').length;
  const run = t.filter((x) => x.st === 'run').length;
  const intr = t.filter((x) => x.st === 'int').length;
  const wait = t.filter((x) => x.st === 'wait').length;
  const act = t.reduce((s, x) => s + x.act, 0);
  const wall = t.reduce((s, x) => s + (x.wall || 12), 0);
  const sp = t.reduce((s, x) => s + x.sp, 0);
  const pending = state.todos.filter((x) => !x).length;
  const totalSize = AGENTS.filter((a) => a.inst).reduce((s, a) => s + a.size, 0);
  return { n: t.length, done, run, intr, wait, act, wall, sp, pending, totalSize };
}

function byAgent() {
  const m = {};
  TASKS.forEach((t) => {
    m[t.a] = m[t.a] || { n: 0, act: 0, sp: 0 };
    m[t.a].n++; m[t.a].act += t.act; m[t.a].sp += t.sp;
  });
  return Object.entries(m).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.act - a.act);
}

/* ============ 组件 ============ */
/* KPI 卡片；传 href 时整张卡片可点击跳转（带箭头提示与 hover 反馈） */
function kpiCard(label, value, sub, cls, href) {
  if (href) {
    return '<a class="kpi klink ' + (cls || '') + '" href="' + esc(href) + '">' +
      '<div class="l">' + label + '<svg class="ka" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>' +
      '<div class="v">' + value + '</div><div class="s">' + sub + '</div></a>';
  }
  return '<div class="kpi ' + (cls || '') + '"><div class="l">' + label + '</div>' +
    '<div class="v">' + value + '</div><div class="s">' + sub + '</div></div>';
}

/* 路径过长时从中间省略，保留盘符/根与叶子目录，完整值放在 title 里 */
function midPath(p, n) {
  n = n || 40;
  if (!p || p.length <= n) return p;
  const head = 12, tail = n - head - 1;
  return p.slice(0, head) + '…' + p.slice(p.length - tail);
}

/* 任务表：状态 | 标题 + 工作目录 | Agent | 活跃 | 空间 | 开始 | 结束 */
function taskRow(t) {
  const tip = (t.dir || '—') + (t.src ? '\n会话文件：' + t.src : '');
  return '<a class="trow" href="#/task/' + t.id + '">' +
    '<span class="st">' + pill(t.st) + markBtn(t) + '</span>' +
    '<span class="tt"><b>' + esc(t.title) + '</b>' +
      '<small title="' + esc(tip) + '">' + esc(t.dir ? midPath(t.dir, 72) : '—') + '</small></span>' +
    '<span class="ag">' + badge(t.a) + '</span>' +
    '<span class="n">' + hm(t.act) + '</span>' +
    '<span class="n">' + fmt(t.sp) + '</span>' +
    '<span class="dim dstart">' + dateStack(t.sd, t.s) + '</span>' +
    '<span class="dim dend">' + dateStack(t.ed || t.sd, t.e, '进行中') + '</span>' +
  '</a>';
}
const taskCard = taskRow;

/* 「标记完成」按钮：只对已中断 / 等待确认的任务显示。
   点击只写本机索引（data/overrides.json），不改 Agent 原始会话；
   行本身是 <a>，所以必须阻止默认跳转与冒泡。
   taskId 含 @ 与冒号，不能拼进内联 onclick（会破坏属性），改用 data-id + 事件委托。 */
const MARKABLE = { int: true, wait: true };
function markBtn(t) {
  if (t.manual) return '<span class="mdone" title="人工标记完成于 ' + esc(t.manualAt || '—') + '">人工完成</span>';
  if (!MARKABLE[t.st]) return '';
  const label = t.st === 'int' ? '标记完成' : '确认完成';
  return '<button class="mark" data-mark="' + esc(t.id) + '" title="标记为已完成（仅记录在本机索引）">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>' +
    label + '</button>';
}

/* 概览「进行中任务」用的紧凑行：左栏宽度不足以放下 7 列表格，
   改为两行式卡片（标题 + 路径 / Agent + 活跃 + 开始时间），避免表头折成竖排单字。 */
function runRow(t) {
  return '<a class="crow" href="#/task/' + t.id + '">' +
    '<div class="cmain"><b>' + esc(t.title) + '</b>' +
      '<small title="' + esc(t.dir || '—') + '">' + esc(t.dir ? midPath(t.dir, 60) : '—') + '</small></div>' +
    '<div class="cmeta">' + badge(t.a) + '<span>' + hm(t.act) + '</span>' +
      '<span>' + dateCell(t.sd, t.s) + '</span>' + pill(t.st) + '</div>' +
  '</a>';
}


/* 每一级可选的分组维度。嵌套顺序由用户点击顺序决定，例如
   [agent, proj, session] = 先按 Agent，再按项目，最后按会话。 */
const GROUP_DIMS = [
  ['agent', '按 Agent', 'A'],
  ['proj', '按项目', 'P'],
  ['session', '按会话', 'S'],
  ['leaf', '最明细目录', 'D'],
  ['up1', '上一级目录', 'U1'],
  ['up2', '上两级目录', 'U2']
];
const GROUP_LABEL = Object.fromEntries(GROUP_DIMS.map(([k, l]) => [k, l]));
const MAX_LEVELS = 4;

function pathParts(p) {
  return String(p || '').replace(/[\\/]+$/, '').split(/[\\/]+/).filter(Boolean);
}

/* 会话的展示名：优先用会话内首条任务标题，让「按会话」分组可读 */
function sessionLabel(t, mode) {
  // 同会话多任务的标题不同，用 sessionId 短码 + 首个任务标题做标识
  const short = String(t.sid || '').replace(/^session-/, '').slice(0, 8);
  const first = sessionFirstTitle(t.sid);
  return (first ? first.slice(0, 42) : '会话 ' + (short || '—'));
}

/* 每个会话的首个任务标题缓存，避免重复遍历 */
let __sessionTitleCache = null;
function sessionFirstTitle(sid) {
  if (!sid) return '';
  if (!__sessionTitleCache) {
    __sessionTitleCache = {};
    for (const t of TASKS) {
      if (!t.sid) continue;
      const cur = __sessionTitleCache[t.sid];
      // 取会话内最早的任务标题作为会话名
      if (!cur || (t.ts || 0) < (cur.ts || 0)) __sessionTitleCache[t.sid] = { ts: t.ts || 0, title: t.title };
    }
  }
  const e = __sessionTitleCache[sid];
  return e ? e.title : '';
}

/* 取某一级的分组键：返回 { key, label, tip } */
function dimKeyOf(t, dim) {
  if (dim === 'agent') return { key: 'A:' + t.a, label: t.a, tip: 'Agent：' + t.a };
  if (dim === 'session') {
    if (!t.sid) return { key: 'S:—', label: '（无会话标识）', tip: '该任务未记录会话 id' };
    return { key: 'S:' + t.sid, label: sessionLabel(t, dim), tip: '会话：' + t.sid };
  }
  if (dim === 'proj') {
    const parts = pathParts(t.dir);
    const name = parts.length ? parts[parts.length - 1] : (t.proj || '—');
    return { key: 'P:' + name, label: name, tip: '项目：' + name };
  }
  const parts = pathParts(t.dir);
  if (!parts.length) return { key: 'U:—', label: '（无工作目录）', tip: '该任务未记录工作目录' };
  const cut = dim === 'up2' ? 2 : dim === 'up1' ? 1 : 0;
  const keep = Math.max(1, parts.length - cut);
  const label = parts.slice(0, keep).join('\\');
  return { key: dim + ':' + label, label, tip: label };
}

/* 组间排序：沿用当前排序维度与方向（组内最新任务） */
function sortGroups(groups) {
  const dir = state.sort === 'asc' ? 1 : -1;
  const byEnd = state.sortKey !== 'start';
  const stamp = (x) => (byEnd ? (x.te || x.ts || 0) : (x.ts || x.te || 0));
  return groups.sort((a, b) => {
    const ta = Math.max(...a.items.map(stamp));
    const tb = Math.max(...b.items.map(stamp));
    return dir * (tb - ta);
  });
}

function groupSum(items) {
  return {
    n: items.length,
    act: items.reduce((s, x) => s + x.act, 0),
    bytes: items.reduce((s, x) => s + x.sp, 0)
  };
}

/* 递归渲染一层分组；levels 用完后落到任务表 */
function renderLevel(items, levels, depth, pathKey) {
  if (!levels.length) return taskTable(items);
  const dim = levels[0];
  const map = new Map();
  for (const t of items) {
    const g = dimKeyOf(t, dim);
    if (!map.has(g.key)) map.set(g.key, { ...g, items: [] });
    map.get(g.key).items.push(t);
  }
  const groups = sortGroups([...map.values()]);
  const openSet = state.groupOpen || (state.groupOpen = {});

  return groups.map((g) => {
    // 嵌套层级用「父路径 + 本级键」做展开状态 key，避免不同父组下同名子组互相串台
    const fullKey = (pathKey ? pathKey + '/' : '') + g.key;
    const open = openSet[fullKey] !== undefined ? !!openSet[fullKey] : depth === 0 && groups.indexOf(g) === 0;
    if (openSet[fullKey] === undefined && depth === 0 && groups.indexOf(g) === 0) openSet[fullKey] = true;
    const s = groupSum(g.items);
    const body = open
      ? (levels.length > 1 ? renderLevel(g.items, levels.slice(1), depth + 1, fullKey) : taskTable(g.items))
      : '';
    return '<div class="grp lv' + depth + (open ? ' open' : '') + '" data-gk="' + esc(fullKey) + '">' +
      // 分组键可能含引号/反斜杠，不用内联 onclick（拼接会破坏属性），改走 data-gk + 事件委托
      '<div class="grp-h" data-toggle="' + esc(fullKey) + '">' +
        '<svg class="cr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></svg>' +
        '<span class="glv">' + esc(GROUP_LABEL[dim] || dim) + '</span>' +
        '<span class="gt" title="' + esc(g.tip) + '">' + esc(g.label) + '</span>' +
        '<span class="gm"><span>' + s.n + ' 个任务</span><span>' + hm(s.act) + '</span><span>' + fmt(s.bytes) + '</span></span>' +
      '</div>' +
      '<div class="grp-b">' + body + '</div>' +
    '</div>';
  }).join('');
}

function groupedTasks(list) {
  const levels = state.groupLevels || [];
  if (!levels.length) return taskTable(list);
  __sessionTitleCache = null;   // 每次渲染重建会话名缓存（数据可能刚刷新）
  return renderLevel(list, levels, 0, '');
}

function toggleGroup(key) {
  if (!state.groupOpen) state.groupOpen = {};
  state.groupOpen[key] = !state.groupOpen[key];
  rerenderTasks();
}

/* 设置嵌套层级：点同一维度可叠加下一级，点「不分组」清空 */
function setGroupLevels(levels) {
  state.groupLevels = levels.slice(0, MAX_LEVELS);
  state.groupOpen = {};   // 换层级时重置展开状态
  rerenderTasks();
  const names = state.groupLevels.map((k) => GROUP_LABEL[k] || k);
  toast(names.length ? '分组层级：' + names.join(' › ') : '已取消分组');
}

/* 在现有层级上追加一级；已存在则移除（点同一维度即取消该级及之后） */
function toggleDim(dim) {
  const cur = (state.groupLevels || []).slice();
  const i = cur.indexOf(dim);
  if (i > -1) setGroupLevels(cur.slice(0, i));
  else if (cur.length < MAX_LEVELS) setGroupLevels(cur.concat([dim]));
  else toast('最多 ' + MAX_LEVELS + ' 级分组');
}

function clearGroups() {
  setGroupLevels([]);
}

/* 兼容旧调用点（如测试脚本里的 setGroup('leaf')） */
function setGroup(mode) {
  if (mode === 'none') return setGroupLevels([]);
  return setGroupLevels([mode]);
}

/* ---------- 列宽：表头抓手可拖动，宽度存 localStorage ---------- */
/* 7 列顺序：状态 | 任务/目录 | Agent | 活跃 | 空间 | 开始 | 结束；
   第 2 列（任务标题）保持弹性，其余列可拖出固定宽度。 */
const COL_DEFAULT = [82, 0, 104, 70, 74, 112, 112];
const COL_LIMITS = [48, 0, 60, 44, 52, 76, 76];   // 每列最小宽度

function loadCols() {
  try {
    const raw = localStorage.getItem('ac.h5.colw');
    const arr = raw ? JSON.parse(raw) : null;
    if (Array.isArray(arr) && arr.length === 7) {
      return arr.map((v, i) => (i === 1 ? 0 : Math.max(COL_LIMITS[i], Math.min(520, Number(v) || COL_DEFAULT[i]))));
    }
  } catch (e) {}
  return COL_DEFAULT.slice();
}

function gridTemplate() {
  return state.colW.map((w, i) => (i === 1 ? 'minmax(0,1fr)' : (w || COL_DEFAULT[i]) + 'px')).join(' ');
}

/* 表头一格：末列以外的格子带一个拖动抓手 */
function headCell(label, col, cls) {
  return '<span class="hcell' + (cls ? ' ' + cls : '') + '">' + label +
    (col === 1 ? '' : '<i class="rz" data-col="' + col + '" title="拖动调整列宽"></i>') + '</span>';
}

function taskTable(list) {
  // 表头与 trow 共用同一份 grid-template（--tc），列宽由拖动决定
  return '<div class="tbl" style="--tc:' + gridTemplate() + '">' +
    '<div class="tbl-h">' +
      headCell('状态', 0) + headCell('任务 / 工作目录', 1) + headCell('Agent', 2) +
      headCell('活跃', 3, 'n') + headCell('空间', 4, 'n') +
      headCell('开始时间', 5, 'dim') + headCell('结束时间', 6, 'dim') +
    '</div>' +
    list.map(taskRow).join('') + '</div>';
}

/* 拖动列宽：pointerdown 落在抓手上时接管，松手写回 localStorage。
   表格会随筛选重渲染，所以监听挂在 document 上、按 data-col 取列号。 */
function bindColumnResize() {
  document.addEventListener('pointerdown', (event) => {
    const handle = event.target && event.target.closest ? event.target.closest('.rz') : null;
    if (!handle) return;
    event.preventDefault();
    const col = Number(handle.getAttribute('data-col'));
    // 第 1 列（索引 1）是弹性列，不参与拖动；其余列都可拖
    if (!Number.isInteger(col) || col < 0 || col === 1 || col >= state.colW.length) return;
    const host = handle.closest('.tbl');
    const startX = event.clientX;
    const startW = state.colW[col] || COL_DEFAULT[col];
    const move = (ev) => {
      const next = Math.round(startW + (ev.clientX - startX));
      state.colW[col] = Math.max(COL_LIMITS[col], Math.min(520, next));
      if (host) host.style.setProperty('--tc', gridTemplate());
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      try { localStorage.setItem('ac.h5.colw', JSON.stringify(state.colW)); } catch (e) {}
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

/* ============ 日期维度（展示 / 排序 / 筛选） ============ */
/* 统一显示完整年月日：2026-10-22（不再省略年份，避免跨年时误读）
   兼容只有 MM-DD 的旧数据：补上当前年份，保证所有日期都带年 */
function shortDate(day) {
  if (!day) return '';
  const s = String(day);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d{2}-\d{2}$/.test(s)) {
    const y = (state.generatedAt || '').slice(0, 4) || String(new Date().getFullYear());
    return y + '-' + s;
  }
  return s;
}

/* 单列日期单元：日期 + 时间；无值时的占位由 caller 指定 */
function dateCell(day, time, emptyLabel) {
  if (!day && !time) return emptyLabel || '—';
  const d = day ? shortDate(day) : '';
  const tm = time || '';
  if (!d) return tm || (emptyLabel || '—');
  return d + (tm ? ' ' + tm : '');
}

/* 任务列表的时间单元：年月日一行、时间一行（列窄也不会挤成一团） */
function dateStack(day, time, emptyLabel) {
  if (!day && !time) return '<span class="ds1">' + esc(emptyLabel || '—') + '</span>';
  const d = day ? shortDate(day) : '';
  if (!d) return '<span class="ds1">' + esc(time || emptyLabel || '—') + '</span>';
  return '<span class="ds1">' + esc(d) + '</span>' +
    (time ? '<span class="ds2">' + esc(time) + '</span>' : '');
}

/* 起止展示（详情页用）：两侧都带完整年月日 */
function dateRange(t) {
  if (!t.sd) return t.s + (t.e ? '–' + t.e : ' 起');
  if (!t.e) return shortDate(t.sd) + ' ' + t.s + ' 起';
  if (t.sd === t.ed) return shortDate(t.sd) + ' ' + t.s + '–' + t.e;
  return shortDate(t.sd) + ' ' + t.s + ' – ' + shortDate(t.ed) + ' ' + t.e;
}

/* 日期范围筛选：按「起止区间与筛选区间有交集」判定，跨天任务不会被漏掉 */
function inDateRange(t, from, to) {
  if (!from && !to) return true;
  const start = t.sd || '';
  const end = t.ed || start;
  if (!start) return false;
  if (from && end < from) return false;
  if (to && start > to) return false;
  return true;
}

/* 任务排序：默认按截止时间（结束时间）倒序；可切换为开始时间。
   仍在进行的任务没有结束时间，用开始时间顶上，保证它们出现在最前面。 */
function sortTasks(list) {
  const dir = state.sort === 'asc' ? 1 : -1;
  const byEnd = state.sortKey !== 'start';
  const stamp = (t) => (byEnd ? (t.te || t.ts || 0) : (t.ts || t.te || 0));
  return list.slice().sort((a, b) => {
    const d = stamp(a) - stamp(b);
    if (d) return d * dir;
    // 同一时间点再按另一个时间、标题稳定排序，避免每次刷新顺序抖动
    const d2 = (byEnd ? (a.ts || 0) - (b.ts || 0) : (a.te || 0) - (b.te || 0));
    if (d2) return d2 * dir;
    return String(a.title).localeCompare(String(b.title));
  });
}

/* 可选日期边界：从任务数据里取最早/最晚，作为 input[type=date] 的上下限 */
function dateBounds() {
  const days = TASKS.map((t) => t.sd).filter(Boolean).sort();
  return { min: days[0] || '', max: days[days.length - 1] || '' };
}

function agentBars() {
  const rows = byAgent();
  const max = Math.max(...rows.map((r) => r.act), 1);
  return rows.map((r) =>
    '<div class="bwrap"><div class="brow"><span>' + badge(r.name) + '</span>' +
    '<span class="v">' + r.n + ' 任务 · ' + hm(r.act) + '</span></div>' +
    '<div class="bar"><i style="width:' + Math.max(4, (r.act / max) * 100).toFixed(0) + '%;background:var(--' + tone(r.name) + ')"></i></div></div>'
  ).join('');
}

/* ============ 视图 ============ */
const RANGES = [['today', '今日'], ['w7', '近 7 天'], ['d14', '近 14 天']];

function rangeBar() {
  return '<div class="filters">' + RANGES.map(([k, l]) =>
    '<button class="' + (state.range === k ? 'on' : '') + '" onclick="setRange(\'' + k + '\')">' + l + '</button>').join('') + '</div>';
}

/* 近 N 天聚合；今日返回 null，直接读 TASKS */
function rangeAgg(r) {
  const days = r === 'w7' ? 7 : r === 'd14' ? 14 : 0;
  if (!days) return null;
  const seg = TREND.slice(-days);
  const n = seg.reduce((a, b) => a + b.n, 0);
  const act = seg.reduce((a, b) => a + b.act, 0);
  return { days, n, act, wall: Math.round(act * 1.31), avg: Math.round(act / Math.max(n, 1)),
    from: seg[0].d, to: seg[seg.length - 1].d };
}

/* 柱图 + 首尾日期标签；峰值由下方注释说明，不在图内居中标注——
   居中的「峰值」会落在非峰值柱下方，容易被误读成该柱的属性。 */
function trendBars() {
  // 数据尚未加载（TREND 为空）时返回占位，避免访问 TREND[0] 抛异常
  if (!TREND.length) return '<div class="trend" style="grid-template-columns:1fr"><i style="height:4px"></i></div>' +
    '<div class="trend-l"><span>暂无数据</span><span></span></div>';
  const max = Math.max(...TREND.map((x) => x.n), 1);
  const last = TREND.length - 1;
  // 列数跟随实际数据条数，避免 TREND 非 14 条时网格对不上
  const cols = 'grid-template-columns:repeat(' + Math.max(1, TREND.length) + ',minmax(0,1fr))';
  // 柱子的悬停提示用完整年月日；图内首尾标签位置窄，只显示「年-月-日」的短式（含年）
  const bars = '<div class="trend" style="' + cols + '">' + TREND.map((x, i) =>
    '<i class="' + (i === last ? 'tod' : x.n / max > 0.8 ? 'hi' : '') + '" style="height:' +
    Math.max(4, (x.n / max) * 100).toFixed(0) + '%" title="' + shortDate(x.d) + ' · ' + x.n + ' 个"></i>').join('') + '</div>';
  const labels = '<div class="trend-l">' +
    '<span>' + shortDate(TREND[0].d) + '</span>' +
    '<span>' + shortDate(TREND[TREND.length - 1].d) + '</span></div>';
  return bars + labels;
}

/* 趋势说明按数据算出，不写死结论（演示数据与真实数据都适用） */
function trendNote() {
  if (!state.live) return '当前为演示数据，接入本地服务后按真实扫描结果更新。';
  const act = TREND.reduce((a, b) => a + b.n, 0);
  const zero = TREND.filter((x) => x.n === 0).length;
  if (!act) return '近 14 天无任务记录。';
  if (zero >= 7) return '近 14 天有 ' + zero + ' 天无任务记录，说明这台机器并非每天使用。';
  const peak = TREND.reduce((a, b) => (b.n > a.n ? b : a), TREND[0]);
  return '近 14 天共 ' + act + ' 个任务，峰值 ' + peak.n + ' 个（' + shortDate(peak.d) + '），无任务的 ' + zero + ' 天。';
}

/* ============ 会话内容深搜（服务端按需索引） ============ */
let deepToken = 0;
async function runDeepSearch() {
  const q = state.q.trim();
  if (q.length < 2) { toast('关键词至少 2 个字符'); return; }
  if (!location.protocol.startsWith('http')) { toast('会话内容搜索需要本地服务'); return; }
  const token = ++deepToken;
  state.deep = { loading: true, error: '', ms: 0, count: 0, items: [] };
  $('#view').innerHTML = viewTasks();
  bindInline();
  try {
    const qs = new URLSearchParams({ q, scope: state.qScope, limit: '40' });
    if (state.filter !== 'all') qs.set('status', state.filter);
    if (state.aFilter !== 'all') qs.set('agent', state.aFilter);
    if (state.dateFrom) qs.set('from', state.dateFrom);
    if (state.dateTo) qs.set('to', state.dateTo);
    const r = await fetch('api/search?' + qs.toString(), { cache: 'no-store' });
    const j = await r.json();
    if (token !== deepToken) return;   // 已被更新的搜索取代
    if (!r.ok || !j.ok) {
      state.deep = { loading: false, error: j.reason || ('HTTP ' + r.status), ms: 0, count: 0, items: [] };
    } else {
      state.deep = { loading: false, error: '', ms: j.ms, count: j.count, items: j.items || [], truncated: j.truncated === true };
    }
  } catch (e) {
    if (token !== deepToken) return;
    state.deep = { loading: false, error: e.message, ms: 0, count: 0, items: [] };
  }
  $('#view').innerHTML = viewTasks();
  bindInline();
}

/* 深搜结果列表：命中片段可点进任务详情 */
function deepResults() {
  const d = state.deep;
  if (d === null) return '';
  if (d.loading) return '<div class="empty" style="padding:24px"><b>正在搜索会话内容…</b>' +
    '<div class="note" style="margin-top:6px;color:inherit;opacity:.8">首次搜索要为每个会话抽一次正文建索引（本机约 500 个会话，可能 1–2 分钟）；' +
    '建好之后同样的搜索是毫秒级。期间可以切到别的页面，回来还在。</div></div>';
  if (d.error) return '<div class="callout amber"><div><b>搜索失败</b><br>' + esc(d.error) + '</div></div>';
  if (d.count === 0) return '<div class="empty" style="padding:24px"><b>没有命中</b>换个关键词，或把范围改成「标题 / 项目 / Agent」</div>';
  return d.items.map((it) => '<div class="dsr">' +
      '<a class="dsr-h" href="#/task/' + esc(it.taskId) + '">' +

/* ============ 日报 ============ */
/* 数据来自 /api/reports（data/日报/*.md）：支持关键字搜索 + 日期区间过滤。
   未连接服务时显示演示日报并标注。 */
const REPORTS = [];
let REPORTS_LIVE = false;
let REPORTS_DATES = [];
const reportState = { q: '', from: '', to: '', openDate: '', content: '', ai: null, aiLoading: false, aiError: '' };

function applyReports(j) {
  const list = (j && j.reports) || [];
  REPORTS.length = 0;
  REPORTS.push(...list.map((r) => ({
    date: r.date, source: r.source, bytes: r.bytes, excerpt: r.excerpt || ''
  })));
  REPORTS_DATES = (j && j.dates) || [];
  REPORTS_LIVE = list.length > 0 || REPORTS_DATES.length > 0;
  state.reportTotal = (j && j.count) || list.length;
}

async function loadReports() {
  if (!location.protocol.startsWith('http')) { REPORTS_LIVE = false; return false; }
  try {
    const qs = new URLSearchParams();
    if (reportState.q) qs.set('q', reportState.q);
    if (reportState.from) qs.set('from', reportState.from);
    if (reportState.to) qs.set('to', reportState.to);
    qs.set('limit', '50');
    const r = await fetch('api/reports?' + qs.toString(), { cache: 'no-store' });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !j.ok) return false;
    applyReports(j);
    // 同步副标题与徽章
    const sb = $('#pgSub');
    if (sb && location.hash.indexOf('reports') > -1) sb.textContent = REPORTS.length + ' 份日报 · 来自 data/日报';
    updateBadge();
    persistView();   // 日报页的搜索/日期筛选也记下来
    return true;
  } catch (e) { return false; }
}

async function openReport(date) {
  if (!location.protocol.startsWith('http')) { toast('需要本地服务才能读取日报原文'); return; }
  try {
    const r = await fetch('api/reports?mode=content&date=' + encodeURIComponent(date), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { toast('读取失败：' + (j.reason || r.status)); return; }
    reportState.openDate = date;
    reportState.content = j.markdown || '';
    $('#view').innerHTML = viewReports();
  } catch (e) { toast('读取失败：' + e.message); }
}

function closeReport() {
  reportState.openDate = '';
  reportState.content = '';
  $('#view').innerHTML = viewReports();
}

async function generateReport(date) {
  if (!location.protocol.startsWith('http')) { toast('需要本地服务'); return; }
  try {
    const d = date || (state.generatedAt ? state.generatedAt.slice(0, 10) : new Date().toISOString().slice(0, 10));
    const r = await fetch('api/reports?mode=generate&date=' + encodeURIComponent(d), { method: 'POST', cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { toast('生成失败：' + (j.reason || r.status)); return; }
    toast('已生成 ' + j.date + ' 日报');
    await loadReports();
    openReport(j.date);
  } catch (e) { toast('生成失败：' + e.message); }
}

/* AI 总结：模型与 key 都在 DSH 里，页面只能请宿主代调（postMessage 桥）。 */
async function generateAiReport(date) {
  if (!AC_EMBEDDED) {
    toast('AI 总结要在 DSH 的 AgentCenter 面板里用：模型与 key 由 DSH 提供');
    return;
  }
  const d = date || (state.generatedAt ? state.generatedAt.slice(0, 10) : new Date().toISOString().slice(0, 10));
  reportState.aiLoading = true;
  reportState.aiError = '';
  $('#view').innerHTML = viewReports();
  const r = await hostRequest('ai-report', { date: d }, 120000);
  reportState.aiLoading = false;
  if (!r || !r.ok || !r.data || !r.data.markdown) {
    reportState.aiError = (r && (r.error || (r.data && r.data.error))) || '未知错误';
    $('#view').innerHTML = viewReports();
    toast('AI 总结失败：' + reportState.aiError);
    return;
  }
  reportState.ai = { date: r.data.date || d, markdown: r.data.markdown, model: r.data.model || '' };
  $('#view').innerHTML = viewReports();
  toast('AI 日报已生成' + (r.data.model ? '（' + r.data.model + '）' : ''));
}

/* 保存 AI 日报：写进 data/日报/<date>.md 顶部的「日报总结（AI）」章节（写前确认） */
async function saveAiReport() {
  const ai = reportState.ai;
  if (!ai) return;
  if (!AC_EMBEDDED) { toast('保存要在 DSH 的 AgentCenter 面板里用'); return; }
  if (!window.confirm('把这份 AI 总结写入 data/日报/' + ai.date + '.md 顶部的「日报总结（AI）」章节吗？\n下方的确定性日报原样保留，重复保存只替换 AI 这一段。')) return;
  const r = await hostRequest('save-report', { date: ai.date, markdown: ai.markdown, model: ai.model }, 30000);
  if (!r || !r.ok) {
    toast('保存失败：' + ((r && (r.error || (r.data && r.data.error))) || '未知错误'));
    return;
  }
  reportState.ai = null;
  toast('已保存到 data/日报/' + r.data.date + '.md');
  await loadReports();
  openReport(r.data.date);
}

function setReportQ(v) { reportState.q = v || ''; loadReports().then(() => { $('#view').innerHTML = viewReports(); bindReportSearch(); }); }
function setReportFrom(v) {
  reportState.from = v || '';
  if (reportState.from && reportState.to && reportState.from > reportState.to) reportState.to = reportState.from;
  loadReports().then(() => { $('#view').innerHTML = viewReports(); bindReportSearch(); });
}
function setReportTo(v) {
  reportState.to = v || '';
  if (reportState.from && reportState.to && reportState.from > reportState.to) reportState.from = reportState.to;
  loadReports().then(() => { $('#view').innerHTML = viewReports(); bindReportSearch(); });
}
function clearReportFilter() {
  reportState.q = ''; reportState.from = ''; reportState.to = '';
  loadReports().then(() => { $('#view').innerHTML = viewReports(); bindReportSearch(); toast('已清除筛选'); });
}

function bindReportSearch() {
  const q = $('#rq');
  if (!q) return;
  // 与任务搜索一致：回车 / 失焦触发，避免输入法组字被打断
  const run = (val) => {
    reportState.q = val;
    loadReports().then(() => {
      $('#view').innerHTML = viewReports();
      bindReportSearch();
    });
  };
  q.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); run(e.target.value); }
    else if (e.key === 'Escape') { e.preventDefault(); if (e.target) e.target.value = ''; run(''); }
  };
  q.onblur = (e) => { if (e.target.value !== reportState.q) run(e.target.value); };
}

  if (reportState.ai) {

/* 极简 Markdown 渲染：标题 / 列表 / 表格 / 引用 / 代码块 / 分隔线 / 段落。
   日报原文与对话正文共用；对话正文里的 message 也走这里，因此不引入外部依赖。 */
function renderMarkdown(md) {
  const lines = String(md || '').replace(/\r/g, '').split(/\n/);
  const out = [];
  let inTable = false;
  let listTag = null;          // 'ul' | 'ol' | null
  let inCode = false;
  let codeBuf = [];
  // 粗体与行内代码：用字符串拼接构造正则，避免与模板字符串的反引号冲突
  const BT = String.fromCharCode(96);
  const RE_BOLD = new RegExp('\\*\\*([^*]+)\\*\\*', 'g');
  const RE_CODE = new RegExp(BT + '([^' + BT + ']+)' + BT, 'g');
  const RE_LINK = /\[([^\]]+)\]\(([^)\s]+)\)/g;
  // 只放行 http(s) / mailto，其余一律变成空链接，避免 javascript: 之类
  const safeUrl = (u) => (/^(https?:\/\/|mailto:)/i.test(String(u)) ? String(u) : '#');
  const inline = (t) => esc(t)
    .replace(RE_BOLD, '<b>$1</b>')
    .replace(RE_CODE, '<code>$1</code>')
    .replace(RE_LINK, (m, label, href) =>
      '<a href="' + safeUrl(href) + '" target="_blank" rel="noreferrer">' + label + '</a>');
  const closeBlocks = () => {
    if (inTable) { out.push('</tbody></table>'); inTable = false; }
    if (listTag) { out.push('</' + listTag + '>'); listTag = null; }
  };
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const t = raw.trim();

    // 代码块：围栏开始/结束之间原样保留（只做 HTML 转义）
    if (/^```/.test(t)) {
      if (!inCode) {
        closeBlocks();
        inCode = true;
        codeBuf = [];
        continue;
      }
      inCode = false;
      out.push('<pre class="md-code"><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
      codeBuf = [];
      continue;
    }
    if (inCode) { codeBuf.push(raw); continue; }

    if (!t) { closeBlocks(); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { closeBlocks(); out.push('<hr>'); continue; }
    if (/^\|/.test(t)) {
      const cells = t.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      if (/^[-: ]+$/.test(cells.join(''))) continue;   // 分隔行
      if (!inTable) { closeBlocks(); out.push('<table class="md-t"><thead><tr>' + cells.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>'); inTable = true; }
      else out.push('<tr>' + cells.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>');
      continue;
    }
    if (/^#{1,6}\s/.test(t)) {
      closeBlocks();
      const lv = t.match(/^#+/)[0].length;
      out.push('<h' + (lv + 2) + '>' + inline(t.replace(/^#+\s*/, '')) + '</h' + (lv + 2) + '>');
      continue;
    }
    if (/^>\s?/.test(t)) { closeBlocks(); out.push('<div class="md-q">' + inline(t.replace(/^>\s?/, '')) + '</div>'); continue; }
    if (/^[-*+]\s/.test(t)) {
      if (listTag !== 'ul') { closeBlocks(); out.push('<ul class="md-l">'); listTag = 'ul'; }
      out.push('<li>' + inline(t.replace(/^[-*+]\s/, '')) + '</li>');
      continue;
    }
    if (/^\d+[.)]\s/.test(t)) {
      if (listTag !== 'ol') { closeBlocks(); out.push('<ol class="md-l">'); listTag = 'ol'; }
      out.push('<li>' + inline(t.replace(/^\d+[.)]\s/, '')) + '</li>');
      continue;
    }
    closeBlocks();
    out.push('<p>' + inline(t) + '</p>');
  }
  if (inCode && codeBuf.length) out.push('<pre class="md-code"><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
  closeBlocks();
  return out.join('');
}

function viewSpace() {
  const inst = AGENTS.filter((a) => a.inst).sort((a, b) => b.size - a.size);
  const total = inst.reduce((s, a) => s + a.size, 0);
  const recycle = FILES.reduce((a, f) => a + f.sz, 0);
  // 交付物 = 总占用 - 可回收中间文件；中间文件比总占用还大时（多 Agent 共享目录重复统计）钳到 0
  const deliv = Math.max(0, total - recycle);
  const delivPct = total > 0 ? Math.round(deliv / total * 100) : 0;
  const MB = 1048576;
  // 优先级按字节比较：≥200 MB 高、≥80 MB 中、其余低（f.sz 现在是字节，不是 MB）
  const hi = FILES.filter((f) => f.sz >= 200 * MB);
  const prio = (sz) => sz >= 200 * MB ? ['高', 'red'] : sz >= 80 * MB ? ['中', 'amber'] : ['低', ''];

  return '<div class="toolbar">' +
      '<span class="muted">递归统计 · 只读 · 不自动删除任何文件</span><div class="sp"></div>' +
      '<button class="btn" onclick="exportFiles()">导出清单</button></div>' +

  '<div class="kpis k4" style="margin-top:0">' +
    kpiCard('总占用', fmt(total), inst.length + ' 个 Agent 根目录') +
    kpiCard('交付物', fmt(deliv), delivPct + '%', 'acc') +
    kpiCard('中间文件', fmt(recycle), '可回收候选', 'warn') +
    kpiCard('高优先级', hi.length + ' 处', '≥ 200 MB', 'bad') +
  '</div>' +

  '<div class="cols2">' +

  '<div class="stack"><section class="sec" style="margin-bottom:0"><div class="sec-h"><h2>中间文件清单</h2><span>合计 ' + fmt(recycle) + ' · 按大小排序</span></div><div class="card">' +
    FILES.slice().sort((a, b) => b.sz - a.sz).map((f) => {
      const [p, c] = prio(f.sz);
      return '<div class="frow"><span class="fn" title="' + esc(f.p) + '">' + esc(f.n) + '</span>' +
        '<span class="chip ' + c + '">' + p + '</span><span class="fs">' + fmt(f.sz) + '</span></div>';
    }).join('') +
    '<div class="note">优先级按单文件体积判定：≥ 200 MB 高、≥ 80 MB 中，其余低。H5 端仅做展示与定位，实际回收需在桌面端逐项确认。</div>' +
  '</div></section></div>' +

  '<div class="stack"><section class="sec" style="margin-bottom:0"><div class="sec-h"><h2>Agent 根目录占用</h2><span>排除符号链接</span></div><div class="card">' +
    '<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;margin-bottom:14px">' +
      inst.map((a) => '<i style="width:' + (a.size / total * 100).toFixed(1) + '%;background:var(--' + a.tone + ')"></i>').join('') +
    '</div>' +
    inst.map((a) => '<div class="bwrap"><div class="brow"><span>' + badge(a.name) + '</span><span class="v">' + fmt(a.size) + ' · ' + a.sess + ' 会话</span></div>' +
      '<div class="bar"><i style="width:' + (a.size / inst[0].size * 100).toFixed(0) + '%;background:var(--' + a.tone + ')"></i></div></div>').join('') +
    '<div class="note">中间文件占比越高，说明该 Agent 的快照与缓存策略越激进。</div>' +
  '</div></section></div>' +

  '</div>' +

  '<section class="sec" style="margin-top:16px"><div class="callout blue"><div><b>为什么这里只统计不清理</b><br>快照与缓存可能仍被 Agent 的运行状态引用，误删会导致会话无法回滚。AgentCenter 的定位是观测，不是清理工具。</div></div></section>';
}

    '<div class="card"><div class="cfg-grid">' + AGENTS.map(cfgRow).join('') + '</div></div></section>' +

  '<div class="stack"><section class="sec" style="margin-bottom:0"><div class="sec-h"><h2>添加自定义 Agent</h2><span>通用适配器，无需改代码</span></div><div class="card">' +
