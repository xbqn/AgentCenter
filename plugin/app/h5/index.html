/* 配置保存：写入服务端 data/config.json（扫描内核真正读取的地方），
   localStorage 仅作离线备份。此前只写 localStorage 导致界面改动对实际扫描无效。 */
function saveAgents() {
  const m = {};
  AGENTS.forEach((a) => { m[a.id] = { on: a.on, path: a.path }; });
  try { localStorage.setItem('ac.h5.agents', JSON.stringify(m)); } catch (e) {}
}

async function persistAgent(a) {
  if (!location.protocol.startsWith('http')) return false;
  try {
    const qs = new URLSearchParams({ action: 'agent', id: a.id, enabled: a.on ? '1' : '0' });
    if (a.path) qs.set('path', a.path);
    const r = await fetch('api/config?' + qs.toString(), { method: 'POST', cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { toast('保存失败：' + (j.reason || r.status)); return false; }
    // 服务端已接受，回填真实配置（含用户自定义路径）
    if (j.config && j.config.agents && j.config.agents[a.id]) {
      const c = j.config.agents[a.id];
      if (c.path) a.path = c.path;
    }
    return true;
  } catch (e) { toast('保存失败：' + e.message); return false; }
}

async function persistResetPath(agentId) {
  if (!location.protocol.startsWith('http')) return false;
  try {
    const qs = new URLSearchParams({ action: 'reset-path' });
    if (agentId) qs.set('id', agentId);
    const r = await fetch('api/config?' + qs.toString(), { method: 'POST', cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { toast('重置失败：' + (j.reason || r.status)); return false; }
    return true;
  } catch (e) { toast('重置失败：' + e.message); return false; }
}

function renderConfig() {
  $('#view').innerHTML = viewConfig();
  if (state.editing >= 0) {
    const el = $('#ap' + state.editing);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

function toggleAgent(i) {
  const a = AGENTS[i];
  if (!a.inst) { toast('未检测到安装，先编辑路径指向正确目录再启用'); return; }
  a.on = !a.on;
  persistAgent(a);
  state.editing = -1;
  saveAgents(); renderConfig();
  toast(a.name + (a.on ? ' 已启用监控' : ' 已停止监控'));
}

function editAgentPath(i) { state.editing = i; renderConfig(); }

function saveAgentPath(i) {
  if (state.editing !== i) return;
  const el = $('#ap' + i);
  if (!el) return;
  const a = AGENTS[i];
  a.path = el.value.trim();
  state.editing = -1;
  saveAgents(); renderConfig();
  // 落到 data/config.json，扫描内核下次即按新路径读取
  persistAgent(a).then((ok) => {
    if (ok) toast('路径已保存到本机配置：' + a.name);
  });
}

function resetAgentPaths() {
  AGENTS.forEach((a) => { a.path = AGPATH[a.id] || ''; a.on = a.inst; });
  persistResetPath('');
  state.editing = -1;
  saveAgents(); renderConfig();
  toast('已恢复默认路径');
}

function testAdapter() {
  const path0 = ($('#ca-p') || {}).value ? $('#ca-p').value.trim() : '';
  const glob = ($('#ca-g') || {}).value ? $('#ca-g').value.trim() : '*.jsonl';
  if (!path0) { toast('请先填写根路径'); return; }
  // 真正校验：调用服务端探测该路径是否存在（不写任何文件）
  if (!location.protocol.startsWith('http')) { toast('需要本地服务才能探测路径'); return; }
  fetch('api/config?action=probe&path=' + encodeURIComponent(path0) + '&glob=' + encodeURIComponent(glob), { method: 'POST', cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => {
      if (!j.ok) { toast('探测失败：' + (j.reason || '')); return; }
      toast(j.exists
        ? '路径可访问：' + j.files + ' 个匹配文件' + (j.files ? '（下次扫描生效）' : '（未找到匹配文件）')
        : '路径不存在：' + path0);
    })
    .catch((e) => toast('探测失败：' + e.message));
}

/* 新增自定义适配器：写入 data/config.json，扫描内核下次即按该路径采集 */
async function addCustomAgent() {
  const name = ($('#ca-n') || {}).value ? $('#ca-n').value.trim() : '';
  const path0 = ($('#ca-p') || {}).value ? $('#ca-p').value.trim() : '';
  const kind = ($('#ca-k') || {}).value ? $('#ca-k').value : 'JSONL';
  const glob = ($('#ca-g') || {}).value ? $('#ca-g').value.trim() : '*.jsonl';
  if (!name) { toast('请填写名称'); return; }
  if (!path0) { toast('请填写根路径'); return; }
  if (!location.protocol.startsWith('http')) { toast('需要本地服务才能保存到配置'); return; }
  try {
    const family = kind === 'JSONL' ? 'claude-jsonl' : (kind === 'SQLite' ? 'vscdb' : 'electron');
    const qs = new URLSearchParams({
      action: 'custom-add',
      id: 'custom-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
      name, path: path0, family, glob
    });
    const r = await fetch('api/config?' + qs.toString(), { method: 'POST', cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { toast('保存失败：' + (j.reason || r.status)); return; }
    toast('适配器已保存：' + name + '（下次扫描生效）');
    // 立即在列表里体现（不等重扫）
    const n = j.config.custom.length;
    loadSummary().then(() => renderConfig());
    if ($('#ca-n')) $('#ca-n').value = '';
    if ($('#ca-p')) $('#ca-p').value = '';
    void n;
  } catch (e) { toast('保存失败：' + e.message); }
}

/* ============ 扫描调度 ============ */
/* 扫描历史：真实记录来自 /api/scans（data/scans.json）；
   未连接本地服务时退回演示数据，并在页面上明确标注。 */
const SCANS = [];   // 真实数据由 /api/scans 填充
let SCANS_LIVE = false;   // 是否已加载真实扫描历史

/* 把服务端记录映射成页面字段：at/ms/sessions/parsed/skipped/tasks/errors/full */
function applyScans(j) {
  const list = (j && j.scans) || [];
  SCANS.length = 0;
  SCANS.push(...list.map((s) => ({
    t: (s.at || '').replace('T', ' ').slice(5, 19) || '—',
    at: s.at || '',
    by: s.full ? '全量扫描' : '增量扫描',
    dur: (s.ms || 0) >= 1000 ? ((s.ms || 0) / 1000).toFixed(1) + 's' : (s.ms || 0) + 'ms',
    nw: s.sessions || 0,
    parsed: s.parsed || 0,
    skipped: s.skipped || 0,
    tp: s.tasks || 0,
    err: s.errors || 0
  })));
  SCANS_LIVE = list.length > 0;
  state.scanTotal = (j && j.total) || list.length;
  state.overrides = (j && j.overrides) || 0;
}

async function refreshScans() {
  const ok = await loadScans();
  if (ok) { toast('扫描历史已刷新：' + SCANS.length + ' 轮'); route(); }
  else toast('未连接本地服务，仍显示演示数据');
}

async function loadScans() {
  if (!location.protocol.startsWith('http')) return false;
  try {
    const r = await fetch('api/scans?limit=50', { cache: 'no-store' });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !j.ok) return false;
    applyScans(j);
    return true;
  } catch (e) { return false; }
}

/* ============ 扫描调度（真实规则来自 data/config.json 的 scan 字段） ============ */
const SCAN_CFG = { intervalMin: 10, intervalEnabled: true, dailyAt: '17:00', dailyEnabled: true, weeklyAt: '09:00', weeklyEnabled: true, reportAuto: true, windowDays: 30 };

function applyScanConfig(cfg) {
  const sc = (cfg && cfg.scan) || {};
  if (sc.intervalMin !== undefined) SCAN_CFG.intervalMin = Number(sc.intervalMin) || 0;
  if (sc.intervalEnabled !== undefined) SCAN_CFG.intervalEnabled = !!sc.intervalEnabled;
  if (sc.dailyAt) SCAN_CFG.dailyAt = sc.dailyAt;
  if (sc.dailyEnabled !== undefined) SCAN_CFG.dailyEnabled = !!sc.dailyEnabled;
  if (sc.weeklyAt) SCAN_CFG.weeklyAt = sc.weeklyAt;
  if (sc.weeklyEnabled !== undefined) SCAN_CFG.weeklyEnabled = !!sc.weeklyEnabled;
  if (sc.reportAuto !== undefined) SCAN_CFG.reportAuto = !!sc.reportAuto;
  if (sc.windowDays !== undefined) SCAN_CFG.windowDays = Number(sc.windowDays) || 30;
}

async function loadScanConfig() {
  if (!location.protocol.startsWith('http')) return false;
  try {
    const r = await fetch('api/config', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) return false;
    applyScanConfig(j.config);
    return true;
  } catch (e) { return false; }
}

/* 调度开关：写入 data/config.json，由 core/scheduler.mjs 实际执行。
   开关同时出现在「扫描调度」与「日报设置」两页，所以重渲染当前页而不是写死 viewSched()。 */
async function toggleScanRule(key, name) {
  const next = !SCAN_CFG[key];
  SCAN_CFG[key] = next;
  const rerender = () => {
    const hash = location.hash || '';
    if (hash.indexOf('sched') > -1) $('#view').innerHTML = viewSched();
    else if (hash.indexOf('report') > -1) $('#view').innerHTML = viewReport();
    else $('#view').innerHTML = viewMe();
  };
  if (!location.protocol.startsWith('http')) {
    rerender();
    toast((next ? '已开启：' : '已关闭：') + name + '（离线不落盘）');
    return;
  }
  try {
    const qs = new URLSearchParams({ action: 'scan' });
    qs.set(key, next ? '1' : '0');
    const r = await fetch('api/config?' + qs.toString(), { method: 'POST', cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { SCAN_CFG[key] = !next; toast('保存失败：' + (j.reason || r.status)); }
    else { applyScanConfig(j.config); toast((next ? '已开启：' : '已关闭：') + name); }
  } catch (e) { SCAN_CFG[key] = !next; toast('保存失败：' + e.message); }
  rerender();
}

/* 对话正文可能很长：纯文本按 260 字折叠，Markdown 消息按高度折叠（.ceb.md-body[data-fold]） */
const CONV_CACHE = {};
const MD_ROLES = { user: 1, assistant: 1, think: 1 };

function convEvent(e, i) {
  const meta = ROLE_META[e.role] || ['消息', 'a'];
  const full = String(e.text || '');
  CONV_CACHE[i] = full;
  const head = '<div class="ceh"><b>' + meta[0] + (e.tool ? ' · ' + esc(e.tool) : '') + '</b>' +
    '<span>' + esc(e.time || '') + '</span></div>';
  if (MD_ROLES[e.role]) {
    const long = full.length > 700;
    return '<div class="cev ' + meta[1] + '">' + head +
      '<div class="ceb md-body md-view" id="ce' + i + '" data-fold="' + (long ? '1' : '0') + '">' +
        renderMarkdown(full) + '</div>' +
      (long ? '<button class="cex" onclick="toggleConvFold(' + i + ')">展开全文（' + full.length + ' 字）</button>' : '') +
    '</div>';
  }
  const long = full.length > 260;
  return '<div class="cev ' + meta[1] + '">' + head +
    '<div class="ceb' + (long ? ' cut' : '') + '" id="ce' + i + '" data-full="' + (long ? 1 : 0) + '">' +
      esc(long ? full.slice(0, 260) : full) + '</div>' +
    (long ? '<button class="cex" onclick="toggleConv(' + i + ')">展开全文（' + full.length + ' 字）</button>' : '') +
  '</div>';
}

/* ============ 与 DSH 插件的宿主桥（iframe 内 ↔ 插件面板） ============
   页面在 DSH 的 AgentCenter 面板里以 iframe 打开，跨域拿不到插件的能力，
   所以「继续对话 / 打开关联会话 / 读关联表」都通过 postMessage 交给宿主执行：
     H5 → 父窗口 { source:'agentcenter-h5', type:'request', requestId, action, payload }
     父窗口 → H5 { source:'dsh-agentcenter', type:'response', requestId, ok, data, error } */
const AC_EMBEDDED = (() => { try { return window.parent !== window; } catch (e) { return false; } })();
/* 嵌在 DSH 面板里时，连接状态 / 上次扫描 / 立即扫描由面板顶部工具条统一展示
   （排在「刷新」前面），页内这份就不重复了；独立打开时仍保留。 */
if (AC_EMBEDDED) {
  try { document.body.setAttribute('data-embedded', '1'); } catch (e) {}
}
const HOST_PENDING = {};
let LINKS = null;
let CURRENT_TASK = null;

function hostRequest(action, payload, timeoutMs) {
  return new Promise((resolve) => {
    if (!AC_EMBEDDED) { resolve({ ok: false, error: 'not-embedded' }); return; }
    const requestId = 'ac' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const limit = Number(timeoutMs) > 0 ? Number(timeoutMs) : 20000;   // 模型调用比普通动作慢
    const timer = setTimeout(() => {
      delete HOST_PENDING[requestId];
      resolve({ ok: false, error: '宿主未响应' });
    }, limit);
    HOST_PENDING[requestId] = (msg) => { clearTimeout(timer); resolve(msg); };
    try {
      window.parent.postMessage({
        source: 'agentcenter-h5', type: 'request',
        requestId: requestId, action: action, payload: payload || {}
      }, '*');
    } catch (e) {
      clearTimeout(timer);
      delete HOST_PENDING[requestId];
      resolve({ ok: false, error: e.message });
    }
  });
}

window.addEventListener('message', function (ev) {
  const m = ev.data;
  if (!m || m.source !== 'dsh-agentcenter') return;
  if (m.type === 'event' && m.event === 'scanned') { refreshAfterScan(); return; }
  if (m.type !== 'response') return;
  const done = HOST_PENDING[m.requestId];
  if (done) { delete HOST_PENDING[m.requestId]; done(m); }
});

/* 宿主定时扫描完成：静默重读索引，保留滚动位置；用户正在输入时不打断 */
let afterScanTimer = null;
function refreshAfterScan() {
  if (afterScanTimer !== null) return;
  const active = document.activeElement;
  if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
  afterScanTimer = setTimeout(async () => {
    afterScanTimer = null;
    const y = window.scrollY;
    await probe();
    window.scrollTo(0, y);
  }, 400);
}

/* 关联表由插件写到 data/links.json，这里只缓存一份用于展示 */
async function ensureLinks(force) {
  if (LINKS && !force) return LINKS;
  const r = await hostRequest('links');
  LINKS = (r && r.ok && r.data && r.data.tasks) ? r.data.tasks : {};
  return LINKS;
}

function renderLinkRow(taskId) {
  const link = LINKS && LINKS[taskId];
  if (link && link.sessionId) {
    return '<div class="row"><div class="b">' +
        '<div class="t">已关联 DSH 会话</div>' +
        '<div class="d mono session-id">' + esc(link.sessionId) + '</div>' +
        '<div class="link-note">关联于 ' + esc((link.at || '').replace('T', ' ').slice(0, 19)) +
          ' · 方式：' + esc(link.action === 'created' ? '新建会话并引入对话' : '打开原会话') + '</div></div>' +
      '<div class="r"><button class="conv-act" onclick="openLinkedSession(\'' + esc(link.sessionId) + '\')">打开该会话</button></div>' +
    '</div>';
  }
  return '<div class="row"><div class="b">' +
      '<div class="t">尚未关联 DSH 会话</div>' +
      '<div class="link-note">在「对话详情」里点「继续对话」会建立关联：DSH 自己的会话直接打开；其它 Agent 的会话内容会导入一个新会话的输入框。</div></div>' +
    '<div class="r"><button class="conv-act" onclick="continueConversation(\'' + esc(taskId) + '\')">继续对话</button></div>' +
  '</div>';
}

function refreshLinkBox(taskId) {
  if (CURRENT_TASK !== taskId) return;
  const box = $('#linkBox');
  if (box) box.innerHTML = renderLinkRow(taskId);
}

async function loadLinksFor(taskId) {
  if (!AC_EMBEDDED) { refreshLinkBox(taskId); return; }
  await ensureLinks();
  refreshLinkBox(taskId);
}

async function continueConversation(taskId) {
  if (!AC_EMBEDDED) {
    toast('请在 DeepSeek Harness 的 AgentCenter 面板中使用「继续对话」');
    return;
  }
  toast('正在处理…');
  const r = await hostRequest('continue', { taskId: taskId });
  if (!r || !r.ok) {
    toast('继续对话失败：' + ((r && r.error) || '未知错误'));
    return;
  }
  LINKS = null;
  await ensureLinks(true);
  refreshLinkBox(taskId);
  loadConversation(taskId);
  const created = r.data && r.data.action === 'created';
  const seeded = r.data && r.data.seeded;
  if (!created) toast('已打开对应的 DSH 会话');
  else if (seeded === 'preserved') toast('已在新会话里打开；草稿里原有内容被保留，可手动插入引用');
  else if (seeded === 'applied') toast('已切换到该任务的工作区，并把引用文件放进对话框');
  else toast('已新建会话（工作区=该任务目录）；自动填入引用失败，可手动插入');
}

async function openLinkedSession(sessionId) {
  if (!AC_EMBEDDED) {
    toast('请在 DeepSeek Harness 的 AgentCenter 面板中打开会话');
    return;
  }
  const r = await hostRequest('open-session', { sessionId: sessionId });
  if (!r || !r.ok) toast('打开会话失败：' + ((r && r.error) || '未知错误'));
}

function renderConversation(c) {
  if (!c.ok) {
    return '<div class="callout amber" style="margin-top:10px"><div><b>无法读取对话</b><br>' +
      esc(c.reason || '未知原因') + '</div></div>';

  if (c.unavailable) {
    return '<div class="callout amber" style="margin-top:10px"><div><b>该 Agent 的对话正文不可读</b><br>' + esc(c.note || '') +
      '<div class="note" style="color:inherit;opacity:.8">源文件：' + brkPath(c.sourceFile) + '</div></div></div>';
  }
  const linked = LINKS && LINKS[c.taskId];
  const head = '<div class="conv-meta">' +
      '<span class="chip green">已读取</span>' +
      '<span>' + c.total + ' 个节点' + (c.truncated ? '（显示前 ' + c.events.length + ' 条）' : '') + '</span>' +
      '<span>' + fmt(c.bytes) + '</span>' +
      '<span>格式 ' + esc(c.family) + (c.frames ? ' · ' + c.frames + ' 帧' : '') + '</span>' +
      '<span>更新 ' + esc((c.mtime || '').replace('T', ' ').slice(0, 19)) + '</span>' +
      (linked ? '<span class="chip">已关联 DSH 会话</span>' : '') +
      '<span class="grow"></span>' +
      (c.taskId ? '<button class="conv-act" onclick="continueConversation(\'' + esc(c.taskId) + '\')">继续对话</button>' : '') +
    '</div>' +
    '<div class="mono conv-src">' + brkPath(c.sourceFile) + '</div>';
  if (!c.events.length) return head + '<div class="empty" style="padding:24px">该会话没有可回放的消息</div>';
  return head + '<div class="conv">' + c.events.map(convEvent).join('') + '</div>' +
    (c.truncated ? '<div class="note">共 ' + c.total + ' 个节点，已显示前 ' + c.events.length + ' 条。用 CLI 可导出完整对话：node cli/agentcenter.mjs conversation --taskId ' + esc(c.taskId) + '</div>' : '');
}

/* Markdown 消息的展开/收起：只切 data-fold，不重渲染 */
function toggleConvFold(i) {

/* ============ 人工标记完成 ============ */
/* 只写本机索引（data/overrides.json），不改 Agent 原始会话；成功后本地同步状态，
   任务随即从「已中断 / 等待确认」的计数与筛选中消失。 */
async function markTaskDone(evt, taskId) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  const t = TASKS.find((x) => x.id === taskId);
  if (!t) return;
  if (!location.protocol.startsWith('http')) {
    toast('需要本地服务：请用 h5/start-h5.cmd 启动后访问');
    return;
  }
  try {
    const r = await fetch('api/task-done?taskId=' + encodeURIComponent(taskId), { method: 'POST', cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { toast('标记失败：' + (j.reason || r.status)); return; }
    // 本地即时生效：改成已完成，并保留原状态用于说明
    t.autoSt = t.st;
    t.st = 'done';
    t.manual = true;
    t.manualAt = j.overrides && j.overrides[taskId] ? j.overrides[taskId].at : null;
    t.reason = '人工标记完成（原判定：' + (STL[t.autoSt] || t.autoSt) + '）';
    rerenderTasks();
    updateBadge();
    toast('已标记完成：该任务不再计入「' + (STL[t.autoSt] || t.autoSt) + '」');
  } catch (e) {
    toast('标记失败：' + e.message);
  }
}

/* 撤销人工标记：恢复机器判定 */
async function unmarkTaskDone(evt, taskId) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  const t = TASKS.find((x) => x.id === taskId);
  if (!t) return;
  if (!location.protocol.startsWith('http')) { toast('需要本地服务'); return; }
  try {
    const r = await fetch('api/task-done?taskId=' + encodeURIComponent(taskId) + '&undo=1', { method: 'POST', cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok) { toast('撤销失败：' + (j.reason || r.status)); return; }
    if (t.autoSt) t.st = t.autoSt;
    t.manual = false;
    t.manualAt = null;
    rerenderTasks();
    updateBadge();
    toast('已撤销人工标记');
  } catch (e) { toast('撤销失败：' + e.message); }
}

async function loadConversation(taskId) {
  const box = $('#convBox');
  if (!box) return;
  if (!location.protocol.startsWith('http')) {
    box.innerHTML = '<div class="callout amber" style="margin-top:10px"><div><b>需要本地服务</b><br>' +
      '对话回放要读取原始会话文件，请通过 h5/start-h5.cmd 启动本地服务后访问。</div></div>';
    return;
  }
  box.innerHTML = '<div class="note" style="margin-top:10px">正在读取原始会话文件…</div>';
  try {
    const r = await fetch('api/conversation?taskId=' + encodeURIComponent(taskId) + '&limit=300', { cache: 'no-store' });
    const j = await r.json();
    if (AC_EMBEDDED) await ensureLinks();
    box.innerHTML = renderConversation(j);
    if (j.ok && !j.unavailable) toast('已读取 ' + j.total + ' 个节点');
  } catch (e) {
    box.innerHTML = '<div class="callout red" style="margin-top:10px"><div><b>读取失败</b><br>' + esc(e.message) + '</div></div>';
  }
}

/* 展开/收起长消息：全文已随响应取回，缓存在 CONV_CACHE */
function toggleConv(i) {
  const el = $('#ce' + i);
  if (!el || !CONV_CACHE[i]) return;
  const btn = el.parentElement.querySelector('.cex');
  const cut = el.classList.toggle('cut');
  el.textContent = cut ? CONV_CACHE[i].slice(0, 260) : CONV_CACHE[i];
  if (btn) btn.textContent = cut ? '展开全文（' + CONV_CACHE[i].length + ' 字）' : '收起';
}


function route() {
  let raw = (location.hash || '').replace(/^#\/?/, '') || 'home';
  // 支持 #/tasks?st=run 这类带查询的深链：查询部分单独解析，不进路由段
  const qi = raw.indexOf('?');
  if (qi > -1) {
    const qs = raw.slice(qi + 1);
    raw = raw.slice(0, qi);
    qs.split('&').forEach((kv) => {
      if (!kv) return;
      const i = kv.indexOf('=');
      const k = decodeURIComponent(i > -1 ? kv.slice(0, i) : kv);
      const v = decodeURIComponent(i > -1 ? kv.slice(i + 1) : '');
      if (k === 'st') state.filter = v || 'all';      // 状态筛选
      else if (k === 'ag') state.aFilter = v || 'all'; // Agent 筛选
    });
  }
  // 任务 id 含冒号、@ 等字符，写入 hash 时会被编码；这里逐段解码再匹配
  const parts = raw.split('/').map((s) => {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  });
  const p = parts[0];
  const view = $('#view');
  let tab = p;
  state.editing = -1;

  if (p === 'task') {
    view.innerHTML = viewDetail(parts[1]);
    tab = 'tasks';
    loadLinksFor(parts[1]);
  } else if (p === 'tasks') {
    view.innerHTML = viewTasks();
  } else if (p === 'todos') {
    view.innerHTML = viewTodos();
  } else if (p === 'reports') {
    view.innerHTML = viewReports();
    if (!REPORTS_LIVE) loadReports();
  } else if (p === 'space') {
    view.innerHTML = viewSpace();
  } else if (p === 'me') {
    view.innerHTML = viewMe();
  } else if (p === 'config') {
    view.innerHTML = viewConfig();
  } else if (p === 'sched') {
    view.innerHTML = viewSched();
    // 调度规则以服务端配置为准：异步拉到后重渲染（离线则保持默认）
    loadScanConfig().then((ok) => { if (ok && location.hash.indexOf('sched') > -1) view.innerHTML = viewSched(); });
  } else if (p === 'conn') {
    view.innerHTML = viewConn();
  } else if (p === 'arch') {
    view.innerHTML = viewArch();
  } else if (p === 'report') {
    view.innerHTML = viewReport();
  } else {
    view.innerHTML = viewHome();
    tab = 'home';
  }

  if (p !== 'task' && p !== 'home') state.prev = '#/' + p;
  else if (p === 'home') state.prev = '#/home';

  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.nav === tab));
  // 选中项不在可视区内时把它滚进来，再刷新左右箭头状态
  const activeNav = document.querySelector('.nav a.on');
  if (activeNav && typeof activeNav.scrollIntoView === 'function') {
    try { activeNav.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
  }
  updateNavArrows();
  window.scrollTo(0, 0);
  syncChrome(p);
  bindInline();
  persistView();
  updateBadge();
}

/* 顶部工具条：标题、副标题、上次扫描 */
const PAGE_META = {
  home: ['概览', '今日工作概览'], tasks: ['任务', '按状态与 Agent 筛选'],
  todos: ['待办', '跨 Agent 汇总'], reports: ['日报', '每日工作汇总 · 可搜索'],
  space: ['文件与空间', '只读统计'],
  config: ['监控对象', '按需启停与路径覆盖'], sched: ['扫描调度', '定时扫描规则'],
  conn: ['Agent 接入', 'MCP 工具与客户端配置'], arch: ['系统架构', '采集 → 解析 → 索引 → 呈现'],
  report: ['日报设置', '生成、存储与隐私'], me: ['设置与关于', '服务状态与说明'],
  task: ['任务详情', '来自本地会话记录']
};

function syncChrome(p) {
  const m = PAGE_META[p] || PAGE_META.home;
  const s = summary();
  let sub = m[1];
  if (p === 'home') sub = '今日 ' + s.n + ' 个任务 · 覆盖 ' + AGENTS.filter((a) => a.inst).length + ' 个 Agent · ' + (state.live ? '本地服务' : (state.online ? '索引未生成' : '演示数据'));
  else if (p === 'tasks') sub = '共 ' + TASKS.length + ' 个任务 · 中断 ' + s.intr + ' 个 · 进行中 ' + s.run + ' 个';
  else if (p === 'todos') sub = '未完成 ' + s.pending + ' 项 · 来自助手消息清单';
  else if (p === 'reports') sub = REPORTS.length ? REPORTS.length + ' 份日报 · ' + (REPORTS_LIVE ? '来自 data/日报' : '演示数据') : '尚无日报 · 可在任务页导出或在 CLI 生成';
  else if (p === 'space') sub = '合计 ' + fmt(s.totalSize) + ' · 只统计不清理';
  const t = $('#pgTitle'), sb = $('#pgSub'), st = $('#tbStamp');
  if (t) t.textContent = m[0];
  if (sb) sb.textContent = sub;

function updateBadge() {
  const nt = $('#navTasks'), nd = $('#navTodos'), nr = $('#navReports');
  if (nt) nt.textContent = TASKS.length;
  if (nd) nd.textContent = state.todos.filter((x) => !x).length;
  if (nr) nr.textContent = (state.reportTotal || REPORTS_DATES.length || REPORTS.length || 0);
}

function bindInline() {
  const q = $('#q');
  if (q) {
    // 搜索用「回车 / 失焦」触发，不用 oninput。
    // 原因：oninput 每敲一个字符就重建 #view，输入框被替换，中文输入法组字过程被打断（无法输入汉字）。
    // 同时避免 IME 组字中的中间态参与过滤。
    const runSearch = () => {
      const v = $('#view');
      if (!v) return;
      v.innerHTML = viewTasks();
      bindInline();
      persistView();
    };
    q.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); state.q = e.target.value; if (state.qScope !== 'title') runDeepSearch(); else runSearch(); }
      else if (e.key === 'Escape') { e.preventDefault(); state.q = ''; if (e.target) e.target.value = ''; runSearch(); }
    };
    q.onblur = (e) => {
      // 失焦时若内容变了才重新查询，避免无谓重渲染
      if (e.target.value !== state.q) { state.q = e.target.value; if (state.qScope !== 'title') runDeepSearch(); else runSearch(); }
    };
    // 组字结束后不自动查询，只提示用户按回车（保持行为可预期）
    q.oncompositionend = () => {};
  }
  // 分组标题的折叠：用事件委托，避免把含引号的分组键拼进内联 onclick
  const v = $('#view');
  if (v && !v.__grpBound) {
    v.__grpBound = true;
    v.addEventListener('click', (e) => {
      // 日报：打开某份 / 返回列表（用 data 属性，避免日期里的字符破坏内联 onclick）
      const rp = e.target.closest('[data-report]');
      if (rp) { e.preventDefault(); e.stopPropagation(); openReport(rp.getAttribute('data-report')); return; }
      if (e.target.closest('[data-closereport]')) { e.preventDefault(); closeReport(); return; }
    if (e.target.closest('[data-closeai]')) { e.preventDefault(); reportState.ai = null; reportState.aiError = ''; $('#view').innerHTML = viewReports(); return; }
      // 人工标记 / 撤销：按钮在 <a class="trow"> 内，必须阻止跳转与冒泡
      const mk = e.target.closest('[data-mark],[data-unmark]');
      if (mk) {
        e.preventDefault();
        e.stopPropagation();
        if (mk.hasAttribute('data-unmark')) unmarkTaskDone(null, mk.getAttribute('data-unmark'));
        else markTaskDone(null, mk.getAttribute('data-mark'));
        return;
      }
      const h = e.target.closest('.grp-h[data-toggle]');
      if (!h) return;
      // 只处理「被点中的那个标题」：点内层标题时事件会冒泡，若不判断会同时切换父层与子层
      if (!h.contains(e.target)) return;
      // 内层标题点击后不再向上冒泡给外层
      e.stopPropagation();
      toggleGroup(h.getAttribute('data-toggle'));
    });
  }
}

/* ============ 交互 ============ */
/* 清空过滤条件：状态 / Agent / 搜索 / 日期区间；排序与分组是展示选项，保留 */
function clearTaskFilters() {
  const nothing = state.filter === 'all' && state.aFilter === 'all' && state.q === '' && !state.dateFrom && !state.dateTo;
  if (nothing) return;
  state.filter = 'all';
  state.aFilter = 'all';
  state.q = '';
  state.dateFrom = '';
  state.dateTo = '';
  rerenderTasks();
  toast('已清空过滤条件');
}

/* 切换搜索范围：切到内容/思考时若有现成关键词，直接搜一次 */
function setQScope(v) {
  state.qScope = v === 'content' || v === 'think' ? v : 'title';
  state.deep = null;
  if (state.qScope !== 'title' && state.q.trim().length >= 2) { runDeepSearch(); return; }
  $('#view').innerHTML = viewTasks();
  bindInline();
}

function setFilter(k) { state.filter = k; $('#view').innerHTML = viewTasks(); bindInline(); persistView(); }
function setAgentFilter(a) {
  state.aFilter = a;
  const h = location.hash || '';
  $('#view').innerHTML = h.indexOf('todos') > -1 ? viewTodos() : viewTasks();
  bindInline();
  persistView();
}
function setRange(k) {
  state.range = k;
  persistView();
  $('#view').innerHTML = viewHome();
  window.scrollTo(0, 0);
}

/* 日期筛选与排序：改 state 后重渲染任务清单，保持滚动位置 */
/* ============ 视图记忆：回到上次的页面与筛选 ============ */
const VIEW_KEY = 'ac.h5.view';
function persistView() {
  try {
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      v: 1,
      route: (location.hash || '').replace(/^#\/?/, ''),
      filter: state.filter,
      aFilter: state.aFilter,
      q: state.q,
      sortKey: state.sortKey,
      sort: state.sort,
      dateFrom: state.dateFrom,
      dateTo: state.dateTo,
      groupLevels: state.groupLevels || [],
      groupOpen: state.groupOpen || {},
      range: state.range,
      report: { q: reportState.q || '', from: reportState.from || '', to: reportState.to || '' }
    }));
  } catch (e) {}
}

/* 启动时恢复：筛选条件 + 上次停留的页面（任务详情不恢复，索引可能已重建） */
function restoreView() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved || saved.v !== 1) return;
  const str = (v, fallback) => (typeof v === 'string' ? v : fallback);
  state.filter = str(saved.filter, state.filter);
  state.aFilter = str(saved.aFilter, state.aFilter);
  state.q = str(saved.q, '');
  state.sortKey = saved.sortKey === 'start' ? 'start' : 'end';
  state.sort = saved.sort === 'asc' ? 'asc' : 'desc';
  state.dateFrom = str(saved.dateFrom, '');
  state.dateTo = str(saved.dateTo, '');
  state.groupLevels = Array.isArray(saved.groupLevels) ? saved.groupLevels.slice() : [];
  state.groupOpen = saved.groupOpen && typeof saved.groupOpen === 'object' && !Array.isArray(saved.groupOpen) ? { ...saved.groupOpen } : {};
  if (saved.range === '7d' || saved.range === '14d' || saved.range === 'today') state.range = saved.range;
  if (saved.report && typeof saved.report === 'object') {
    reportState.q = str(saved.report.q, '');
    reportState.from = str(saved.report.from, '');
    reportState.to = str(saved.report.to, '');
  }
  const hash = (location.hash || '').replace(/^#\/?/, '');
  let route = str(saved.route, '');
  if (route.indexOf('task/') === 0) route = 'tasks';
  if (hash === '' && route !== '') {
    try { history.replaceState(null, '', '#/' + route); } catch (e) { /* 忽略 */ }
  }
}

function rerenderTasks() {
  const v = $('#view');
  const y = window.scrollY;
  v.innerHTML = viewTasks();
  bindInline();
  window.scrollTo(0, y);
  persistView();
}
function setDateFrom(v) {
  state.dateFrom = v || '';
  // 起止颠倒时自动纠正，避免出现空结果还看不出原因
  if (state.dateFrom && state.dateTo && state.dateFrom > state.dateTo) state.dateTo = state.dateFrom;
  rerenderTasks();
}
function setDateTo(v) {
  state.dateTo = v || '';
  if (state.dateFrom && state.dateTo && state.dateFrom > state.dateTo) state.dateFrom = state.dateTo;
  rerenderTasks();
}
function clearDate() {
  state.dateFrom = '';
  state.dateTo = '';
  rerenderTasks();
  toast('已清除日期筛选');
}
function setSort(k) {
  state.sort = k === 'asc' ? 'asc' : 'desc';
  rerenderTasks();
  toast(state.sort === 'asc' ? '按' + (state.sortKey === 'start' ? '开始' : '截止') + '时间正序（最早在前）' : '按' + (state.sortKey === 'start' ? '开始' : '截止') + '时间倒序（最新在前）');
}
/* 排序维度：截止（结束）时间 / 开始时间；默认截止时间倒序 */
function setSortKey(k) {
  state.sortKey = k === 'start' ? 'start' : 'end';
  rerenderTasks();
  toast(state.sortKey === 'start' ? '已改为按开始时间排序' : '已改为按截止时间排序');
}
/* 排序下拉：一次同时决定维度与方向（end-desc / end-asc / start-desc / start-asc） */
function setSortChoice(choice) {
  const parts = String(choice || 'end-desc').split('-');
  state.sortKey = parts[0] === 'start' ? 'start' : 'end';
  state.sort = parts[1] === 'asc' ? 'asc' : 'desc';
  rerenderTasks();
  toast('排序：' + (state.sortKey === 'start' ? '开始时间' : '截止时间') + (state.sort === 'asc' ? '正序' : '倒序'));
}
/* 分组下拉：选中一个维度就追加一级；重复选同一维度等于移除（沿用 toggleDim） */
function addGroupDim(dim) {
  if (!dim) return;
  toggleDim(dim);
}

/* 生成文件并触发下载；file:// 与 https 均可用 */
function download(name, text) {
  try {
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('已导出 ' + name);
  } catch (e) { toast('导出失败：' + e.message); }
}

/* 导出用文件名与标题里的日期：取真实生成日期，不写死 */
function todayStr() {
  if (state.generatedAt) return state.generatedAt.slice(0, 10);
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function exportReport() {
  const s = summary();
  const day = todayStr();
  const rows = TASKS.map((t) =>
    '| ' + t.a + ' | ' + String(t.title).replace(/\|/g, '\\|') + ' | ' + t.proj + ' | ' + t.s + '–' + (t.e || '进行中') + ' | ' +
    hm(t.act) + ' | ' + STL[t.st] + ' | ' + fmt(t.sp) + ' |').join('\n');
  const todo = TODOS.map((t, i) => '- [' + (state.todos[i] ? 'x' : ' ') + '] ' + t.t + '（' + t.a + ' · ' + t.p + '）').join('\n');
  const dist = byAgent().map((r) => '- ' + r.name + '：' + r.n + ' 个任务 · 活跃 ' + hm(r.act)).join('\n');
  const md = '# AgentCenter 日报 · ' + day + '\n\n' +
    '> 覆盖 ' + AGENTS.filter((a) => a.inst).length + ' 个 Agent · 任务 ' + s.n + ' 个 · 活跃 ' + hm(s.act) + ' · 墙钟 ' + hm(s.wall) + ' · 占用 ' + fmt(s.totalSize) + '\n\n' +
    '## 今日任务\n\n| Agent | 任务 | 项目 | 起止 | 活跃 | 状态 | 空间 |\n|---|---|---|---|---|---|---|\n' + rows + '\n\n' +
    '## 待办\n\n' + (todo || '（无）') + '\n\n## 各 Agent 分布\n\n' + dist + '\n\n' +
    '## 说明\n\n数据由 AgentCenter 只读扫描本地会话记录生成，中间文件仅统计不删除。\n';
  download('AgentCenter日报-' + day + '.md', md);
}

function exportTodos() {
  const day = todayStr();
  const md = '# 待办清单 · ' + day + '\n\n' + TODOS.map((t, i) =>
    '- [' + (state.todos[i] ? 'x' : ' ') + '] ' + t.t + '\n  - 来源：' + t.a + ' · 项目：' + t.p).join('\n') + '\n';
  download('待办清单-' + day + '.md', md);
}

function exportFiles() {
  const day = todayStr();
  const md = '# 中间文件清单 · ' + day + '\n\n| 路径 | 说明 | 来源 | 大小 |\n|---|---|---|---|\n' +
    FILES.slice().sort((a, b) => b.sz - a.sz).map((f) =>
      '| ' + f.p + ' | ' + f.n + ' | ' + f.a + ' | ' + fmt(f.sz) + ' |').join('\n') +
    '\n\n优先级：≥ 200 MB 高、≥ 80 MB 中，其余低。清理需人工确认，AgentCenter 不会自动删除。\n';
  download('中间文件清单-' + day + '.md', md);
}

/* 待办勾选按 id 持久化（ac.h5.todos.map）：服务端待办数量变化后仍能恢复用户的选择。
   兼容旧格式（纯数组）——按顺序回填，避免老用户丢失已勾选项。 */
function readTodoMap() {
  try {
    const raw = localStorage.getItem('ac.h5.todos');
    if (!raw) return {};
    const j = JSON.parse(raw);
    if (Array.isArray(j)) {
      const map = {};
      TODOS.forEach((x, i) => { if (j[i] !== undefined) map[x.id || ('idx' + i)] = !!j[i]; });
      return map;
    }
    return (j && typeof j === 'object') ? j : {};
  } catch (e) { return {}; }
}

function saveTodoMap() {
  try {
    const map = {};
    TODOS.forEach((x, i) => { map[x.id || ('idx' + i)] = !!state.todos[i]; });
    localStorage.setItem('ac.h5.todos', JSON.stringify(map));
  } catch (e) {}
}

function toggleTodo(i) {
  state.todos[i] = !state.todos[i];
  saveTodoMap();
  const v = $('#view');
  if ((location.hash || '').indexOf('todos') > -1) { v.innerHTML = viewTodos(); updateBadge(); }
  else { v.innerHTML = viewHome(); updateBadge(); }
  toast(state.todos[i] ? '已标记完成（仅本地记录）' : '已恢复为未完成');
}

function toggleAuto() {
  state.auto = !state.auto;
  try { localStorage.setItem('ac.h5.auto', state.auto ? '1' : '0'); } catch (e) {}
  $('#view').innerHTML = viewMe();
  toast(state.auto ? '已开启（原型：由本机脚本实际注册）' : '已关闭');
}

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
}

function doRefresh(fromBtn) {
  // 在 DSH 插件面板里：HTTP 侧不开放扫描，交给宿主在进程内跑一轮，再整体重读。
  if (AC_EMBEDDED) { scanViaHost(); return; }
  const btn = $('#btnRefresh');
  if (btn) btn.classList.add('spin');
  const done = async () => {
    if (btn) btn.classList.remove('spin');
    const ok = await loadSummary();
    if (ok) {
      const d = new Date();
      state.lastScan = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      route();
      toast('已重新读取索引：' + TASKS.length + ' 个任务');
    } else {
      toast('未连接本地服务或索引尚未生成，仍为演示数据');
    }
  };
  setTimeout(done, 500);
}

/* 嵌在 DSH 面板里时：请宿主在进程内扫一轮，然后整体重读（健康检查 + 索引 + 扫描历史 + 日报），
   左下角的「上次扫描」随 probe() 一起刷新。 */
async function scanViaHost() {
  const btn = $('#btnRefresh');
  const html = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.classList.add('spin');
    btn.textContent = '正在扫描…';
  }
  let r = null;
  try {
    r = await hostRequest('scan', {});
  } catch (e) {
    r = { ok: false, error: e.message };
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('spin');
      btn.innerHTML = html;
    }
  }
  const data = (r && r.data) || {};
  if (!r || !r.ok || data.ok !== true) {
    toast('扫描失败：' + ((r && (r.error || data.error)) || '未知错误'));
    return;
  }
  if (data.scannedAt) state.lastScan = data.scannedAt;
  await probe();
  toast('已扫描：' + TASKS.length + ' 个任务' + (data.scannedAt ? ' · ' + data.scannedAt : ''));
}

/* ============ 本地服务探测与数据加载 ============ */
/* ============ 离线兜底（仅在连不上本地服务时使用） ============ */
/* 页面本身是「真实数据的只读视图」：所有列表默认空，由 /api/* 填充。
   但直接用浏览器打开 h5/index.html（file://）时必须仍能评审，故提供一份
   结构真实、内容明确标注的示例数据，并在顶栏写清「演示数据」。 */
function ensureOfflineFallback() {

    ['trae', 'Trae', 'SQLite', 0, 0, 'purple'],

    ['zcode', 'zcode', 'JSONL', 0, 0, 'blue'],
    ['codex', 'Codex CLI', 'JSONL', 0, 0, 'green'],
    ['claudecode', 'Claude Code', 'JSONL', 0, 0, 'coral'],
    ['doubao', '豆包工作台', 'Electron 存储', 0, 0, 'teal']
  ];
  AGENTS.length = 0;
  AGENTS.push(...AG.map(([id, name, kind, sess, size, tone]) => ({

    ['codebuddy', 'CodeBuddy', '排查启动脚本中文乱码导致的启动失败', 'order-batch', '10:05', '10:22', 17, 12, 'run', 22, 9, 12, 2, 1],
    ['atomcode', 'AtomCode', '重构 Obsidian 规划目录为年/月层级', 'knowledge-base', '11:30', '12:41', 71, 54, 'done', 48, 26, 96, 214, 0],
    ['opencode', 'OpenCode', '评估 ARM 架构容器化可行性', 'infra-eval', '13:02', '13:35', 33, 28, 'int', 18, 7, 44, 3, 3],

async function probe() {
  // file:// 下没有服务可连，直接进入演示态，避免控制台报 CORS/网络错误
  if (!location.protocol.startsWith('http')) {
    state.online = false;
    ensureOfflineFallback();
    const lv = $('#live'); if (lv) lv.classList.remove('on');
    const ab = $('#abSub'); if (ab) ab.textContent = '本地 HTML 模式 · 演示数据';
    route();
    return;
  }
  try {
    const r = await fetch('api/health', { cache: 'no-store' });
    if (!r.ok) throw new Error('bad status');
    const j = await r.json();
    state.online = true;
    if (j.lastScan) state.lastScan = j.lastScan;
    if (j.dataDir) state.dataDir = j.dataDir;
    if (Number(j.port) > 0) state.servicePort = Number(j.port);
    if (j.generatedAt) state.generatedAt = j.generatedAt;
    // 环境能力：旧版 Node 缺 zstd 时，DSH 会话读不出来——把原因留在页面上，而不是静默少数据
    state.zstd = j.zstd !== false;
    state.nodeNotice = typeof j.notice === 'string' ? j.notice : '';
    const lv = $('#live'); if (lv) lv.classList.add('on');
    const ab = $('#abSub');
    if (ab) ab.textContent = '本地服务已连接 · 上次扫描 ' + state.lastScan;
  } catch (e) {
    state.online = false;
    ensureOfflineFallback();
    const lv = $('#live'); if (lv) lv.classList.remove('on');
    const ab = $('#abSub'); if (ab) ab.textContent = '演示数据 · 上次扫描 ' + state.lastScan;
    route();
    return;
  }
  // 服务可用时读取真实索引与扫描历史；索引缺失则保持演示数据并明确标注
  const ok = await loadSummary();
  await loadScans();   // 扫描历史与索引互不依赖，独立加载
  await loadReports(); // 日报列表（同样独立）
  if (!ok) {
    ensureOfflineFallback();
    const ab = $('#abSub');
    if (ab) ab.textContent = '本地服务已连接 · 索引尚未生成（演示数据）';
    route();
    return;
  }
  const ab = $('#abSub');
  if (ab) ab.textContent = '本地服务已连接 · 上次扫描 ' + state.lastScan;
  route();
}

  const savedMap = readTodoMap();

/* ============ 顶部菜单横向滚动：超出可视区时给出左右箭头 ============ */
function scrollNav(direction) {
  const nav = $('#nav');
  if (!nav) return;
  const step = Math.max(120, Math.round(nav.clientWidth * 0.7));
  nav.scrollBy({ left: direction * step, behavior: 'smooth' });
  setTimeout(updateNavArrows, 340);
}

/* 右箭头：只要菜单还能往右滚就常显（滚到头变灰，避免隐藏/显示的宽度抖动）；
   左箭头：滚出去以后才出现，初始状态不摆一个点不动的灰键。 */
function updateNavArrows() {
  const nav = $('#nav');
  const left = $('#navL');
  const right = $('#navR');
  if (!nav || !left || !right) return;
  const max = nav.scrollWidth - nav.clientWidth;
  const scrollable = max > 2;
  const atLeft = nav.scrollLeft <= 2;
  const atRight = nav.scrollLeft >= max - 2;
  left.dataset.show = scrollable && !atLeft ? '1' : '0';
  right.dataset.show = scrollable ? '1' : '0';
  left.disabled = atLeft;
  right.disabled = atRight;
}

$('#nav').addEventListener('scroll', updateNavArrows, { passive: true });
window.addEventListener('resize', updateNavArrows);

// 任务表列宽：恢复上次拖动的宽度，并挂上拖动监听（表格会随筛选重渲染，监听挂在 document 上）
state.colW = loadCols();
bindColumnResize();

// 菜单宽度取决于字体是否已就绪，等一拍再判定要不要显示箭头
updateNavArrows();
setTimeout(updateNavArrows, 120);
setTimeout(updateNavArrows, 600);

// 启动顺序：先探测数据源，再由 probe() 统一渲染首屏。
// 否则会先用空数据渲染一屏「演示数据」，等接口返回后又被替换，用户会看到闪动与错误标注。
restoreView();
updateBadge();
probe();
