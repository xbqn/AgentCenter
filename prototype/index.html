*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer}
a{cursor:pointer}
.shell{display:flex;min-height:100vh}
.rail{width:212px;flex:0 0 212px;background:var(--surface);border-right:.5px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px}
.brand h1{font-size:14px;font-weight:500}

.navlabel{font-size:11px;color:var(--tx3);padding:14px 8px 5px}

.nav.on{background:var(--blue-bg);color:var(--blue);border-color:rgba(24,95,165,.22);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 6px}
.nav.on .dot{opacity:1}
.nav .count{margin-left:auto;font-size:11px;background:var(--surface2);padding:0 6px;border-radius:9px;color:var(--tx2)}
.nav.on .count{background:#fff;color:var(--blue)}
.main{flex:1;min-width:0;padding:20px 26px 60px;max-width:1500px}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h2{font-size:19px;font-weight:500}
.top p{font-size:12px;color:var(--tx3);margin-top:2px}
.spacer{flex:1}
.seg{display:flex;background:var(--surface);border:.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;color:var(--tx2)}
.seg button.on{background:var(--blue);color:#fff}
.btn{border:.5px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 13px;color:var(--tx)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#12507f}
.sel{border:.5px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 10px;color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface2);border-radius:var(--r);padding:13px 15px}
.kpi .l{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:23px;font-weight:500;margin-top:3px;letter-spacing:-.4px}
.kpi .s{font-size:11px;color:var(--tx3);margin-top:1px}
.kpi.acc .v{color:var(--blue)} .kpi.warn .v{color:var(--amber)} .kpi.bad .v{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--tx2);border:.5px solid var(--line)}
.chip.blue{background:var(--blue-bg);color:var(--blue);border-color:rgba(24,95,165,.2)}
.chip.green{background:var(--green-bg);color:var(--green);border-color:rgba(59,109,17,.2)}
.chip.amber{background:var(--amber-bg);color:var(--amber);border-color:rgba(133,79,11,.2)}
.chip.red{background:var(--red-bg);color:var(--red);border-color:rgba(163,45,45,.2)}
.chip.purple{background:var(--purple-bg);color:var(--purple);border-color:rgba(83,74,183,.2)}
.card{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card h3{font-size:13px;font-weight:500;margin-bottom:2px}
.card .sub{font-size:11.5px;color:var(--tx3);margin-bottom:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:11.5px;font-weight:500;color:var(--tx3);text-align:left;padding:0 8px 8px;border-bottom:.5px solid var(--line)}
td{padding:9px 8px;border-bottom:.5px solid var(--line);font-size:12.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tbody tr.clk{cursor:pointer}
.ttl{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub2{font-size:11px;color:var(--tx3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:3px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.st.done{background:var(--green-bg);color:var(--green)}
.st.run{background:var(--blue-bg);color:var(--blue)}
.st.int{background:var(--red-bg);color:var(--red)}
.st.wait{background:var(--amber-bg);color:var(--amber)}
.st.i{width:5px;height:5px;border-radius:50%;background:currentColor}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.todo{display:flex;gap:9px;padding:8px 0;border-bottom:.5px solid var(--line);align-items:flex-start}
.todo:last-child{border-bottom:0}
.cbx{width:14px;height:14px;border-radius:4px;border:1px solid var(--line2);margin-top:2px;flex:0 0 14px;background:var(--surface)}
.cbx.on{background:var(--green);border-color:var(--green);position:relative}
.cbx.on:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.todo p{font-size:12.5px}
.todo .m{font-size:11px;color:var(--tx3);margin-top:1px}
.todo.done p{text-decoration:line-through;color:var(--tx3)}
.hr{height:.5px;background:var(--line);margin:13px 0}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.ev{position:relative;padding:0 0 15px}
.ev:before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line2)}
.ev.u:before{border-color:var(--blue)} .ev.a:before{border-color:var(--teal)} .ev.t:before{border-color:var(--amber)}
.ev .h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.ev .who{font-size:12px;font-weight:500}
.ev .tm{font-size:11px;color:var(--tx3)}
.ev .bd{font-size:12.5px;color:var(--tx2);margin-top:3px}

.kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:7px 12px;font-size:12.5px}
.kv dt{color:var(--tx3)}

.setrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--line)}

.rel{position:relative}

.main{container-type:inline-size}
@container (max-width:1100px){

  .grid2,.cols{grid-template-columns:minmax(0,1fr)}

@container (max-width:900px){

  .nav{white-space:nowrap;padding:6px 9px;font-size:12px}
  .nav .count{display:none}
  .rail>div[style*="flex:1"]{display:none}
  .main{padding:14px 14px 48px;max-width:none}
}

body.narrow{background:var(--surface2)}

body.narrow .brand{padding:0 8px 0 0;flex:0 0 auto}
body.narrow .brand>div:last-child{display:none}
body.narrow .navlabel{display:none}
body.narrow .nav{white-space:nowrap;padding:6px 9px;font-size:12px}
body.narrow .nav .count{display:none}
body.narrow .rail>div[style*="flex:1"]{display:none}
body.narrow .main{padding:14px 14px 48px;max-width:none}
/* ---- 原型预览控制条 ---- */
.devbar{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:5px;background:var(--surface);border:.5px solid var(--line2);border-radius:10px;padding:5px 7px 5px 9px;font-size:11px;color:var(--tx3);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.devbar button{border:0;background:transparent;font-size:11px;padding:3px 7px;border-radius:6px;color:var(--tx2)}
.devbar button.on{background:var(--blue-bg);color:var(--blue);font-weight:500}
.devbar a{color:var(--blue);font-size:11px;padding-left:7px;margin-left:3px;border-left:.5px solid var(--line)}
@media(max-width:560px){.devbar{right:8px;bottom:8px;font-size:10px}}

  <div style="text-align:center;color:var(--tx3);font-size:11px">↓ 增量写入</div>
  ${layer('索引层','JSON 分月分片 + 指纹增量，落盘插件目录',['index/2026-10.json','fingerprints.json','scans.json'],'purple')}
  <div style="text-align:center;color:var(--tx3);font-size:11px">↓ 读取渲染</div>

 </div></div>

const V={dash,tasks:null,todos:null,files:null,agents,sched,conn,set,arch};
function taskView(){
 return `<div class="top"><div><h2>任务列表</h2><p>共 128 个任务 · 今日 ${T.length} 个 · 点击行进入详情</p></div><div class="spacer"></div>
 <div class="seg"><button class="on">今日</button><button>本周</button><button>本月</button><button>自定义</button></div>
 <select class="sel"><option>全部 Agent</option>${A.filter(x=>x.inst).map(x=>`<option>${x.name}</option>`).join('')}</select>
 <select class="sel"><option>全部状态</option><option>已完成</option><option>进行中</option><option>已中断</option><option>等待确认</option></select>
 <button class="btn pri">立即扫描</button></div>
 <div class="card">

   <td><span class="sub2">${t.s} – ${t.e||'进行中'}</span></td>
   <td><span style="font-size:12px">${t.act}</span><span class="sub2">墙钟 ${t.wall}</span></td>
   <td>${status(t.st)}</td>
   <td><span style="font-size:12px">${t.sp} MB</span></td>
   <td style="color:var(--tx3)">›</td></tr>`).join('')}</tbody></table></div>`;
}
let CUR='dash';
function show(v){CUR=v;
 const nt=document.getElementById('navTasks'), nd=document.getElementById('navTodos');
 if(nt)nt.textContent=T.length; if(nd)nd.textContent=TODOS.filter(x=>!x.done).length;
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===v));
 const m=document.getElementById('main');
 m.innerHTML = v==='tasks' ? taskView()
   : v==='todos' ? todoView()
   : v==='files' ? fileView()
   : V[v]();
 window.scrollTo(0,0);}
function detailPage(id){show('dash');const m=document.getElementById('main');m.innerHTML=detailHtml(id);window.scrollTo(0,0);}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>show(n.dataset.v));
function sw(i,el){el.classList.toggle('on')}
function tog(i){TODOS[i].done=!TODOS[i].done;show(CUR==='todos'?'todos':'dash')}
window.show=show;window.detail=detailPage;window.sw=sw;window.tog=tog;
function vw(w,el){
  document.body.classList.toggle('narrow',w==='narrow');
  document.querySelectorAll('.devbar button').forEach(b=>b.classList.toggle('on',b.dataset.w===w));
  window.scrollTo(0,0);
}
window.vw=vw;
function route(){
  const h=(location.hash||'').replace('#','');
  if(!h) return show('dash');
  if(h.startsWith('task/')) return detailPage(h.slice(5));
  if(V[h]||h==='tasks'||h==='todos'||h==='files') return show(h);
  show('dash');
}
window.addEventListener('hashchange',route);
route();
</script>
